<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualizando LiveMu</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            user-select: none;
            border: 1px solid #333;
            overflow: hidden;
        }
        .logo {
            font-size: 2.5rem;
            font-weight: 800;
            color: #007bff;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo span { color: #ffd700; }
        .status {
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: #b0b0b0;
            text-align: center;
            padding: 0 20px;
            min-height: 20px;
        }
        .progress-container {
            width: 80%;
            height: 6px;
            background-color: #2b2b2b;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 10px;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.3);
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #007bff, #00d2d3);
            width: 0%;
            transition: width 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 123, 255, 0.5);
        }
        .percentage {
            font-size: 0.8rem;
            color: #666;
            font-family: monospace;
        }
        /* Permite arrastrar la ventana aunque no tenga bordes */
        .drag-region {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            -webkit-app-region: drag;
            z-index: -1;
        }
    </style>
</head>
<body>
    <div class="drag-region"></div>
    
    <div class="logo">
        <i class="fa-solid fa-gamepad"></i> Live<span>Mu</span>
    </div>
    
    <div id="status" class="status">Preparando actualización...</div>
    
    <div class="progress-container">
        <div id="progress" class="progress-bar"></div>
    </div>
    
    <div id="percentage" class="percentage">0%</div>

    <script>
        const { ipcRenderer } = require('electron');

        ipcRenderer.on('update-status', (event, text) => {
            const statusEl = document.getElementById('status');
            
            // Traducción amigable de los mensajes técnicos
            if (text.includes('Downloading')) text = "Descargando actualización...";
            if (text.includes('Downloaded')) text = "Descarga completada. Reiniciando...";
            if (text.includes('Checking')) text = "Buscando actualizaciones...";
            if (text.includes('Error')) text = "Ocurrió un error.";
            
            statusEl.innerText = text;
        });

        ipcRenderer.on('update-progress', (event, progress) => {
            const val = Math.floor(progress);
            document.getElementById('progress').style.width = val + '%';
            document.getElementById('percentage').innerText = val + '%';
        });
    </script>
</body>
</html>
