<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Multi-Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --dark-bg: #18181b; --dark-text: #e4e4e7; --dark-panel: #27272a; --dark-border: #3f3f46;
            --light-bg: #f4f4f5; --light-text: #18181b; --light-panel: #ffffff; --light-border: #d4d4d8;
            --primary-blue: #3b82f6; --primary-red: #ef4444;
            --font-size: 20px; 
            --emote-size: 28px;
            --anim-duration: 0.3s;
        }
        body.dark { --bg-color: var(--dark-bg); --text-color: var(--dark-text); --panel-color: var(--dark-panel); --border-color: var(--dark-border); --hover-bg: rgba(255, 255, 255, 0.1); }
        body.light { --bg-color: var(--light-bg); --text-color: var(--light-text); --panel-color: var(--light-panel); --border-color: var(--light-border); --hover-bg: rgba(0, 0, 0, 0.05); }
        body {
            font-family: 'Open Sans', Arial, sans-serif; margin: 0; overflow: hidden;
            display: flex; flex-direction: column; height: 100vh;
            background-color: var(--bg-color); color: var(--text-color);
        }
        .header { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; background-color: var(--panel-color); border-bottom: 1px solid var(--border-color); flex-shrink: 0; font-family: 'Segoe UI', Tahoma, sans-serif;}
        .header h3 { margin: 0; font-size: 1rem; font-weight: bold; }
        .controls { display: flex; gap: 8px; }
        .btn { background: transparent; border: 1px solid var(--border-color); color: var(--text-color); padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; display: flex; align-items: center; gap: 5px; }
        .btn:hover { background-color: rgba(128, 128, 128, 0.1); }
        .btn.active { background-color: var(--primary-blue); color: white; border-color: var(--primary-blue); }
        .btn-danger { border-color: var(--primary-red); color: var(--primary-red); }
        .btn-danger:hover { background-color: rgba(239, 68, 68, 0.2); }
        
        .filter-btn { background: transparent; border: 1px solid var(--border-color); border-radius: 6px; padding: 4px 8px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; }
        .filter-btn:hover { background-color: rgba(128, 128, 128, 0.1); }
        .filter-btn.inactive { opacity: 0.4; filter: grayscale(100%); }

        #chat-container {
            flex-grow: 1; overflow-y: auto; overflow-x: hidden; padding: 15px; display: flex; flex-direction: column;
            font-size: var(--font-size);
        }
        
        .chat-line {
            padding: 2px 8px;
            background-color: transparent;
            border-radius: 4px;
            line-height: 1.3;
            word-wrap: break-word;
            overflow-wrap: anywhere;
            cursor: pointer;
            transition: all 0.2s;
            animation: slideIn var(--anim-duration) cubic-bezier(0.25, 1, 0.5, 1) forwards;
            width: fit-content;
            max-width: 100%;
            transform-origin: bottom left;
            border-left: 3px solid transparent;
        }
        .chat-line:first-child { margin-top: auto; }
        .chat-line:hover { background-color: var(--hover-bg); }
        .chat-line.speaking { background-color: rgba(59, 130, 246, 0.2); border-left-color: var(--primary-blue); }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px) scale(0.95); }
            to { opacity: 1; transform: translateX(0) scale(1); }
        }

        /* Widget Estilos Replicados */
        .badges { display: inline-flex; align-items: center; vertical-align: middle; margin-right: 3px; }
        .badge { width: 16px; height: 16px; margin-right: 2px; margin-bottom: 3px; border-radius: 10%; }
        .platform-icon { margin-right: 6px; display: inline-block; vertical-align: middle; font-size: 0.9em; }
        .message-body { display: inline; word-wrap: break-word; }
        .username { font-weight: 800; }
        .colon { color: var(--text-color); font-weight: 800; margin-right: 6px; }
        .message-content { font-weight: 800; color: var(--text-color); }
        .emote-container { display: inline-block; }
        .emote { max-width: calc(var(--emote-size) * 4); height: var(--emote-size); margin-right: -3px; vertical-align: middle; display: inline-block; margin-top: -4px; }
        .chat-gif-wrapper { display: block; margin: 6px 0; }
        img.gif, .chat-gif { max-height: 140px; max-width: 240px; border-radius: 8px; object-fit: contain; box-shadow: 0 4px 10px rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.15); vertical-align: middle; display: inline-block; margin: 4px 0; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
        
        .hidden-platform { display: none !important; }
    </style>
</head>
<body class="dark" id="body-theme">
    <div class="header">
        <div style="display: flex; align-items: center; gap: 5px;">
            <i class="fa-solid fa-filter" style="color: #888; margin-right: 5px;" title="Filtros"></i>
            <div style="display: flex; gap: 4px;">
                <button class="filter-btn" onclick="changeFontSize(-1)" title="Reducir Letra"><i class="fa-solid fa-minus"></i></button>
                <button class="filter-btn" onclick="changeFontSize(1)" title="Aumentar Letra"><i class="fa-solid fa-plus"></i></button>
                <div style="width: 1px; background: var(--border-color); margin: 0 5px;"></div>
                <button id="filter-tiktok" class="filter-btn" onclick="toggleFilter('tiktok')" style="color: #ff0050; border-color: rgba(255, 0, 80, 0.5);" title="Alternar TikTok"><i class="fa-brands fa-tiktok"></i></button>
                <button id="filter-twitch" class="filter-btn" onclick="toggleFilter('twitch')" style="color: #9146FF; border-color: rgba(145, 70, 255, 0.5);" title="Alternar Twitch"><i class="fa-brands fa-twitch"></i></button>
                <button id="filter-kick" class="filter-btn" onclick="toggleFilter('kick')" style="color: #53fc18; border-color: rgba(83, 252, 24, 0.5);" title="Alternar Kick"><i class="fa-brands fa-kickstarter"></i></button>
            </div>
        </div>
        <div class="controls">
            <button id="btn-tts-pause" class="btn" onclick="socket.emit('tts-control', 'toggle-pause')"><i class="fa-solid fa-pause"></i> Pausar</button>
            <button class="btn btn-danger" onclick="socket.emit('tts-control', 'skip-queue')"><i class="fa-solid fa-forward-step"></i> Omitir</button>
            <button id="btn-theme" class="btn" onclick="toggleTheme()" title="Modo Claro/Oscuro"><i class="fa-solid fa-sun"></i></button>
        </div>
    </div>
    <div id="stream-stats" style="position: fixed; top: 55px; right: 15px; background: rgba(20, 20, 20, 0.85); color: white; padding: 8px 15px; border-radius: 20px; font-family: 'Segoe UI', sans-serif; z-index: 9999; display: flex; gap: 15px; font-weight: bold; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(5px); box-shadow: 0 4px 6px rgba(0,0,0,0.3); pointer-events: none;">
        <div style="display: flex; align-items: center; gap: 6px;">
            <span style="color: #ff4757; font-size: 1.1rem;">❤️</span> 
            <span id="stats-likes" style="font-size: 1rem; text-shadow: 1px 1px 2px black;">0</span>
        </div>
        <div style="display: flex; align-items: center; gap: 6px;">
            <span style="color: #1e90ff; font-size: 1.1rem;">👁️</span> 
            <span id="stats-viewers" style="font-size: 1rem; text-shadow: 1px 1px 2px black;">0</span>
        </div>
    </div>
    <div id="chat-container"><div style="text-align: center; color: #888; margin-top: auto; margin-bottom: auto;">Esperando mensajes...</div></div>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script>
        // --- LÓGICA DEL TEMA ---
        function toggleTheme() {
            const body = document.getElementById('body-theme');
            body.classList.toggle('dark');
            body.classList.toggle('light');
            const isDark = body.classList.contains('dark');
            document.getElementById('btn-theme').innerHTML = isDark ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
            localStorage.setItem('multichat_theme', isDark ? 'dark' : 'light');
        }
        if (localStorage.getItem('multichat_theme') === 'light') {
            document.getElementById('body-theme').classList.remove('dark');
            document.getElementById('body-theme').classList.add('light');
            window.addEventListener('DOMContentLoaded', () => {
                const btn = document.getElementById('btn-theme');
                if (btn) btn.innerHTML = '<i class="fa-solid fa-moon"></i>';
            });
        }

        // --- LÓGICA DE TAMAÑO DE LETRA ---
        let currentFontSize = parseInt(localStorage.getItem('multichat_fontsize')) || 20;
        document.documentElement.style.setProperty('--font-size', currentFontSize + 'px');

        function changeFontSize(delta) {
            currentFontSize += delta;
            if (currentFontSize < 12) currentFontSize = 12;
            if (currentFontSize > 40) currentFontSize = 40;
            document.documentElement.style.setProperty('--font-size', currentFontSize + 'px');
            localStorage.setItem('multichat_fontsize', currentFontSize);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // --- LÓGICA DEL FILTRO DE PLATAFORMAS ---
        const platformFilters = { tiktok: true, twitch: true, kick: true };
        function toggleFilter(platform) {
            platformFilters[platform] = !platformFilters[platform];
            const btn = document.getElementById(`filter-${platform}`);
            if (platformFilters[platform]) btn.classList.remove('inactive');
            else btn.classList.add('inactive');
            
            document.querySelectorAll('.chat-line').forEach(el => {
                if (el.dataset.platform === platform) {
                    if (platformFilters[platform]) el.classList.remove('hidden-platform');
                    else el.classList.add('hidden-platform');
                }
            });
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        const urlParams = new URLSearchParams(window.location.search);
        const streamToken = urlParams.get('token') || 'default';
        const socketHost = (typeof window !== 'undefined' && window.location && window.location.origin) ? window.location.origin : '';
        const socket = io(socketHost, {
            query: { token: streamToken },
            reconnection: true,
            reconnectionAttempts: Infinity,
            reconnectionDelay: 1000
        });
        const chatContainer = document.getElementById('chat-container');
        
        let emotes = {}; 
        let twitchBadgesMap = {};
        
        const USER_COLORS = [
            '#FF0000', '#0000FF', '#008000', '#B22222', '#FF7F50',
            '#9ACD32', '#FF4500', '#2E8B57', '#DAA520', '#D2691E',
            '#5F9EA0', '#1E90FF', '#FF69B4', '#8A2BE2', '#00FF7F'
        ];

        function getUserColor(username) {
            let hash = 0;
            for (let i = 0; i < username.length; i++) { hash = username.charCodeAt(i) + ((hash << 5) - hash); }
            return USER_COLORS[Math.abs(hash % USER_COLORS.length)];
        }

        // --- SISTEMA DE EMOTES (7TV, BTTV, FFZ) ---
        function addEmotes(newEmotes) { Object.assign(emotes, newEmotes); }
        async function fetchGlobalEmotes() {
            try { const res = await fetch('https://7tv.io/v3/emote-sets/global'); const data = await res.json(); if(data.emotes) { const map = {}; data.emotes.forEach(e => map[e.name] = `https://cdn.7tv.app/emote/${e.id}/2x.webp`); addEmotes(map); } } catch(e){}
            try { const res = await fetch('https://api.betterttv.net/3/cached/emotes/global'); const data = await res.json(); if(Array.isArray(data)) { const map = {}; data.forEach(e => map[e.code] = `https://cdn.betterttv.net/emote/${e.id}/2x`); addEmotes(map); } } catch(e){}
            try { const res = await fetch('https://api.frankerfacez.com/v1/set/global'); const data = await res.json(); if(data.sets && data.sets[3]) { const map = {}; data.sets[3].emoticons.forEach(e => map[e.name] = `https://cdn.frankerfacez.com/emote/${e.id}/2`); addEmotes(map); } } catch(e){}
        }
        async function fetchChannelEmotes(broadcasterId) {
            if(!broadcasterId) return;
            try { const res = await fetch(`https://7tv.io/v3/users/twitch/${broadcasterId}`); const data = await res.json(); if(data.emote_set && data.emote_set.emotes) { const map = {}; data.emote_set.emotes.forEach(e => map[e.name] = `https://cdn.7tv.app/emote/${e.id}/2x.webp`); addEmotes(map); } } catch(e){}
            try { const res = await fetch(`https://api.betterttv.net/3/cached/users/twitch/${broadcasterId}`); const data = await res.json(); const map = {}; if(data.channelEmotes) data.channelEmotes.forEach(e => map[e.code] = `https://cdn.betterttv.net/emote/${e.id}/2x`); if(data.sharedEmotes) data.sharedEmotes.forEach(e => map[e.code] = `https://cdn.betterttv.net/emote/${e.id}/2x`); addEmotes(map); } catch(e){}
            try { const res = await fetch(`https://api.frankerfacez.com/v1/room/id/${broadcasterId}`); const data = await res.json(); if(data.sets) { const map = {}; Object.values(data.sets).forEach(set => { if(set.emoticons) set.emoticons.forEach(e => map[e.name] = `https://cdn.frankerfacez.com/emote/${e.id}/2`); }); addEmotes(map); } } catch(e){}
        }
        fetchGlobalEmotes();

    // --- CONTADORES DE STATS (LIKES Y VIEWERS) ---
    let currentLocalLikes = 0;
    let currentLocalViewers = 0;

    function formatNumberStats(num) {
        if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
        if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
        return num;
    }

    socket.on('data', (data) => {
        if (data.sessionGlobalLikes !== undefined) {
            currentLocalLikes = data.sessionGlobalLikes;
            document.getElementById('stats-likes').innerText = formatNumberStats(currentLocalLikes);
        }
        if (data.viewerCount !== undefined) {
            currentLocalViewers = data.viewerCount;
            document.getElementById('stats-viewers').innerText = formatNumberStats(currentLocalViewers);
        }
    });

    socket.on('viewer_count', (count) => {
        currentLocalViewers = count;
        document.getElementById('stats-viewers').innerText = formatNumberStats(currentLocalViewers);
    });

    socket.on('like_event', (data) => {
        if (data.totalLikeCount !== undefined && data.totalLikeCount > 0) {
            currentLocalLikes = parseInt(data.totalLikeCount);
        } else if (data.total_like_count !== undefined && data.total_like_count > 0) {
            currentLocalLikes = parseInt(data.total_like_count);
        } else {
            currentLocalLikes += parseInt(data.likeCount || 1, 10);
        }
        document.getElementById('stats-likes').innerText = formatNumberStats(currentLocalLikes);
    });

        // --- MOTOR DE DIBUJADO DE MENSAJES ---
        function addMessage(platform, user, message, badges = [], color = '#ffffff', twitchEmotes = null, msgId = null, customTTS = null, gifUrl = null, gifs = []) {
            if (chatContainer.innerHTML.includes('Esperando mensajes...')) chatContainer.innerHTML = '';

            const isScrolledToBottom = Math.ceil(chatContainer.scrollHeight - chatContainer.clientHeight) <= Math.ceil(chatContainer.scrollTop) + 15;

            const entry = document.createElement('div');
            entry.className = 'chat-line';
            entry.dataset.platform = platform;
            if (!platformFilters[platform]) entry.classList.add('hidden-platform');
            
            if (msgId) entry.id = msgId;
            
            let platformIcon = '';
            if (platform === 'twitch') platformIcon = '<i class="fa-brands fa-twitch platform-icon" style="color: #9146FF;"></i>';
            else if (platform === 'tiktok') platformIcon = '<i class="fa-brands fa-tiktok platform-icon" style="color: #ff0050;"></i>';
            else if (platform === 'kick') platformIcon = '<i class="fa-brands fa-kickstarter platform-icon" style="color: #53fc18;"></i>';

            const twitchEmoteMap = {};
            if (twitchEmotes) {
                Object.keys(twitchEmotes).forEach(id => {
                    const ranges = twitchEmotes[id];
                    if (ranges && ranges.length > 0) {
                        const [start, end] = ranges[0].split('-').map(Number);
                        const code = message.substring(start, end + 1);
                        twitchEmoteMap[code] = `https://static-cdn.jtvnw.net/emoticons/v2/${id}/default/dark/2.0`;
                    }
                });
            }

            // Detección de GIFs de Twitch / ChatIS
            const gifMatch = message.match(/\[(.*?) GIF by (.*?)\]/i) || message.match(/\[(.*?) GIF\]/i);
            if (gifMatch && !customTTS) {
                customTTS = `${user} envió un GIF: ${gifMatch[1] || 'animado'}`;
            }

            let processedMessage = message;
            let isGifOnly = false;

            // Renderizado de GIFs (igual que ChatIS)
            if (gifs && gifs.length > 0) {
                const sortedGifs = [...gifs].sort((a, b) => (b.start || 0) - (a.start || 0));
                for (const gif of sortedGifs) {
                    if (gif.url) {
                        const img = `<img class="gif chat-gif" src="${gif.url}" data-id="${gif.id || ''}" loading="lazy" />`;
                        if (processedMessage.match(/\[(.*?) GIF by (.*?)\]/i)) {
                            processedMessage = processedMessage.replace(/\[(.*?) GIF by (.*?)\]/i, img);
                            isGifOnly = true;
                        } else if (processedMessage.match(/\[(.*?) GIF\]/i)) {
                            processedMessage = processedMessage.replace(/\[(.*?) GIF\]/i, img);
                            isGifOnly = true;
                        } else if (!isNaN(gif.start) && !isNaN(gif.end) && gif.start >= 0 && gif.end >= gif.start) {
                            processedMessage = processedMessage.slice(0, gif.start) + img + processedMessage.slice(gif.end + 1);
                        } else {
                            processedMessage += ' ' + img;
                        }
                    }
                }
            } else if (gifUrl) {
                const img = `<img class="gif chat-gif" src="${gifUrl}" loading="lazy" />`;
                if (processedMessage.match(/\[(.*?) GIF by (.*?)\]/i)) {
                    processedMessage = processedMessage.replace(/\[(.*?) GIF by (.*?)\]/gi, img);
                    isGifOnly = true;
                } else if (processedMessage.match(/\[(.*?) GIF\]/i)) {
                    processedMessage = processedMessage.replace(/\[(.*?) GIF\]/gi, img);
                    isGifOnly = true;
                } else {
                    processedMessage += ' ' + img;
                }
            }

            // Si no es un mensaje puramente de GIF, parsear emotes de Twitch y 7TV
            if (!isGifOnly) {
                const words = processedMessage.split(' ');
                processedMessage = words.map(word => {
                    if (word.startsWith('<img') || word.includes('chat-gif')) return word;
                    if (twitchEmoteMap[word]) return `<span class="emote-container"><img src="${twitchEmoteMap[word]}" class="emote" alt="${word}"></span>`;
                    if (emotes[word]) return `<span class="emote-container"><img src="${emotes[word]}" class="emote" alt="${word}"></span>`;
                    return word;
                }).join(' ');

                processedMessage = processedMessage.replace(/\[kick_emote:([^\]]+)\]/g, '<span class="emote-container"><img src="$1" class="emote"></span>');
            }

            const badgesHtml = badges.map(b => `<img src="${b}" class="badge">`).join('');

            entry.innerHTML = `
                <div class="message-body">
                    ${platformIcon}
                    <span class="badges">${badgesHtml}</span>
                    <span class="username" style="color: ${color}">${user}</span><span class="colon">:</span> <span class="message-content">${processedMessage}</span>
                </div>
            `;

            entry.onclick = () => {
                const textToSpeak = customTTS || `${user} dice: ${message}`;
                socket.emit('tts-control', { action: 'force-speak', text: textToSpeak, elementId: msgId });
            };
            
            chatContainer.appendChild(entry);

            if (isScrolledToBottom) {
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }
            if (chatContainer.childElementCount > 200) chatContainer.removeChild(chatContainer.firstChild);
        }
        
        // --- CONECTAR EVENTOS ---
        socket.on('connect', () => {
            console.log('[Multichat] Conectado a sala:', streamToken);
            socket.emit('join-room', streamToken);
            socket.emit('get_data', streamToken);
            socket.emit('request-twitch-status', streamToken);
        });
        socket.on('twitch-badges', map => twitchBadgesMap = map);
        socket.on('twitch-connection-status', status => {
            if(status.type === 'connected' && status.broadcasterId) fetchChannelEmotes(status.broadcasterId);
        });

        socket.on('tiktok-event', payload => {
            if(payload.type === 'chat') {
                const d = payload.data;
                const username = d.uniqueId || d.nickname || 'User';
                addMessage('tiktok', username, d.comment, [], getUserColor(username), null, 'msg-' + (d.msgId || Date.now()));
            } else if (payload.type === 'gift') {
                const d = payload.data;
                const username = d.nickname || d.uniqueId || (d.user && d.user.nickname) || 'User';
                const giftName = d.giftName || (d.gift && d.gift.name) || 'un regalo';
                const giftImg = d.giftPictureUrl || (d.gift && d.gift.icon && d.gift.icon.url_list ? d.gift.icon.url_list[0] : '') || (d.image && d.image.url_list ? d.image.url_list[0] : '');
                
                let msgText = `🎁 envió ${giftName} x${d.repeatCount || 1}`;
                if (giftImg) {
                    msgText = `envió <img src="${giftImg}" style="height: 1.8em; vertical-align: middle; margin: 0 4px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));"> <span style="font-weight:900; color:#FFD700;">x${d.repeatCount || 1}</span>`;
                }
                msgText += ` <span style="font-size: 0.8em; color: #aaa;">(${d.calculatedCoins || 0}💎)</span>`;
                
                addMessage('tiktok', username, msgText, [], '#ff0050', null, 'msg-gift-' + Date.now(), `${username} envió ${giftName} por ${d.repeatCount || 1}`);
            }
        });

        socket.on('twitch-event', payload => {
            if(payload.type === 'chat') {
                const d = payload.data;
                let badgeUrls = [];
                if (d.badges && twitchBadgesMap) {
                    Object.keys(d.badges).forEach(key => {
                        if (twitchBadgesMap[key] && twitchBadgesMap[key][d.badges[key]]) badgeUrls.push(twitchBadgesMap[key][d.badges[key]]);
                    });
                }
                let gifs = d.gifs || [];
                if ((!gifs || gifs.length === 0) && d.tags && typeof d.tags.gifs === 'string') {
                    gifs = d.tags.gifs.split(',').map(gif => {
                        const parts = gif.split('|');
                        const bounds = parts[0] || '';
                        const id = parts[1] || '';
                        let url = parts[2] || (id ? `https://media.giphy.com/media/${id}/giphy.gif` : '');
                        if (url && url.startsWith('//')) url = 'https:' + url;
                        let [start, end] = bounds.split('-');
                        return { start: parseInt(start), end: parseInt(end), id, url };
                    });
                }
                let gifUrl = d.gifUrl || (gifs.length > 0 && gifs[0].url ? gifs[0].url : null);
                if (!gifUrl && d.tags) {
                    const gid = d.tags['msg-param-giphy-id'] || d.tags['giphy-id'] || d.tags['msg-param-gif-id'];
                    if (gid) gifUrl = `https://media.giphy.com/media/${gid}/giphy.gif`;
                }
                addMessage('twitch', d.user || d.username, d.message, badgeUrls, d.color || '#9146FF', d.emotes, 'msg-' + d.id, null, gifUrl, gifs);
            }
        });

        socket.on('kick-event', payload => {
            if(payload.type === 'chat') {
                const d = payload.data;
                const username = d.nickname || d.uniqueId || d.username || (d.sender && d.sender.username) || 'Usuario';
                addMessage('kick', username, d.comment || d.message || d.content || '', [], '#53fc18', null, 'msg-kick-' + Date.now());
            }
        });

        // --- CONTROLES DE VOZ UI ---
        socket.on('tts-state-change', (state) => {
            const btn = document.getElementById('btn-tts-pause');
            if (state.isPaused) {
                btn.innerHTML = '<i class="fa-solid fa-play"></i> Reanudar';
                btn.classList.add('active');
            } else {
                btn.innerHTML = '<i class="fa-solid fa-pause"></i> Pausar';
                btn.classList.remove('active');
            }
        });

        socket.on('tts-speaking-change', ({ elementId, isSpeaking }) => {
            document.querySelectorAll('.chat-line.speaking').forEach(el => el.classList.remove('speaking'));
            if (isSpeaking && elementId) {
                const el = document.getElementById(elementId);
                if (el) {
                    el.classList.add('speaking');
                    el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            }
        });
    </script>
</body>
</html>
