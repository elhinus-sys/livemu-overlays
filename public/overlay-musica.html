<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiveMu - Ahora Suena</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #c084fc;
            --bg-glass: rgba(10, 10, 18, 0.85);
        }

        body {
            background-color: transparent;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: white;
            overflow: hidden;
            text-shadow: 0 0 8px rgba(0,0,0,0.5);
        }

        .widget-card {
            background: var(--bg-glass);
            backdrop-filter: blur(12px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-radius: 0.75rem;
            width: 320px;
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .hidden-widget {
            opacity: 0;
            transform: translateY(15px) scale(0.98);
        }

        .equalizer { display: flex; align-items: flex-end; gap: 2px; height: 14px; width: 18px; }
        .bar { background: var(--accent); width: 3px; border-radius: 1px; animation: equalize 1s ease-in-out infinite; }
        .bar:nth-child(1) { animation-duration: 0.8s; }
        .bar:nth-child(2) { animation-duration: 1.2s; }
        .bar:nth-child(3) { animation-duration: 1s; }
        @keyframes equalize { 0%, 100% { height: 4px; } 50% { height: 14px; } }

        .title-wrapper { overflow: hidden; white-space: nowrap; position: relative; padding-left: 2px; }
        .has-mask { mask-image: linear-gradient(to right, transparent, black 5%, black 95%, transparent); -webkit-mask-image: linear-gradient(to right, transparent, black 5%, black 95%, transparent); }
        .scrolling-text { display: inline-block; animation: marquee-scroll linear infinite; }
        @keyframes marquee-scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
        .track-item { border-left: 2px solid transparent; transition: all 0.2s ease; }
    </style>
</head>
<body class="p-6">

    <div id="widget-container" class="widget-card hidden-widget p-4">
        <div class="flex items-center gap-3 mb-1">
            <div class="equalizer flex-shrink-0" id="equalizer">
                <div class="bar"></div><div class="bar"></div><div class="bar"></div>
            </div>
            <div class="min-w-0 flex-grow">
                <p class="text-[10px] uppercase font-bold text-violet-300 tracking-widest mb-0.5">Ahora Suena</p>
                <div id="title-container" class="title-wrapper h-7">
                    <p id="widget-title" class="font-bold text-base leading-tight">Esperando canción...</p>
                </div>
                <p id="widget-artist" class="text-xs text-gray-400 font-medium truncate mt-0.5 empty:hidden"></p>
            </div>
        </div>
        <div id="up-next-section" class="mt-3 pt-3 border-t border-white/10 hidden">
            <h2 class="text-[10px] uppercase font-bold text-violet-300 tracking-widest mb-2">A Continuación</h2>
            <ul id="widget-up-next-list" class="space-y-1.5"></ul>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script>
        const widgetContainer = document.getElementById('widget-container');
        const widgetTitle = document.getElementById('widget-title');
        const widgetArtist = document.getElementById('widget-artist');
        const titleContainer = document.getElementById('title-container');
        const upNextSection = document.getElementById('up-next-section');
        const upNextList = document.getElementById('widget-up-next-list');
        
        function updateWidget(data) {
            if (!data || !data.currentSong) {
                widgetContainer.classList.add('hidden-widget');
                return;
            }

            widgetContainer.classList.remove('hidden-widget');
            const { title, author } = data.currentSong;
            widgetArtist.textContent = author || '';
            widgetTitle.textContent = title;

            setTimeout(() => {
                const isOverflowing = widgetTitle.scrollWidth > titleContainer.clientWidth;
                widgetTitle.classList.toggle('scrolling-text', isOverflowing);
                titleContainer.classList.toggle('has-mask', isOverflowing);
                if (isOverflowing) {
                    widgetTitle.innerHTML = `${title} <span class="mx-6"></span> ${title} <span class="mx-6"></span>`;
                    const duration = (widgetTitle.scrollWidth / 2) / 40;
                    widgetTitle.style.animationDuration = `${duration}s`;
                }
            }, 50);

            const upNext = data.queue || [];
            if (upNext.length > 0) {
                upNextList.innerHTML = upNext.slice(0, 2).map(song => `
                    <li class="track-item flex items-center text-sm">
                        <svg class="w-3 h-3 text-violet-400 mr-2 flex-shrink-0" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.28-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
                        <span class="text-gray-200 truncate font-medium">${song.title}</span>
                    </li>`).join('');
                upNextSection.classList.remove('hidden');
            } else {
                upNextSection.classList.add('hidden');
            }
        }

        const socket = io("http://localhost:3011", {
            reconnection: true,
            reconnectionAttempts: Infinity,
            reconnectionDelay: 1000
        });

        socket.on('music-update', updateWidget);
        socket.on('disconnect', () => updateWidget(null));
    </script>
</body>
</html>
