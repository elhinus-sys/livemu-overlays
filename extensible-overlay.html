<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temporizador Extensible</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00f2fe;
            --primary-rgb: 0, 242, 254;
            --accent: #4facfe;
            --accent-rgb: 79, 172, 254;
            --glow: rgba(0, 242, 254, 0.45);
            --bg-card: rgba(13, 17, 28, 0.85);
            --border-card: rgba(0, 242, 254, 0.3);
            --text-color: #ffffff;
            --danger: #ff4757;
            --warning: #ffa502;
            --success: #2ed573;
        }

        /* --- TEMAS VISUALES --- */
        body[data-theme="gold"] {
            --primary: #ffd700;
            --primary-rgb: 255, 215, 0;
            --accent: #ffa502;
            --accent-rgb: 255, 165, 2;
            --glow: rgba(255, 215, 0, 0.45);
            --border-card: rgba(255, 215, 0, 0.35);
        }

        body[data-theme="purple"] {
            --primary: #c084fc;
            --primary-rgb: 192, 132, 252;
            --accent: #e879f9;
            --accent-rgb: 232, 121, 249;
            --glow: rgba(192, 132, 252, 0.45);
            --border-card: rgba(192, 132, 252, 0.35);
        }

        body[data-theme="red"] {
            --primary: #ff4757;
            --primary-rgb: 255, 71, 87;
            --accent: #ff6b81;
            --accent-rgb: 255, 107, 129;
            --glow: rgba(255, 71, 87, 0.45);
            --border-card: rgba(255, 71, 87, 0.35);
        }

        body[data-theme="matrix"] {
            --primary: #2ed573;
            --primary-rgb: 46, 213, 115;
            --accent: #7bed9f;
            --accent-rgb: 123, 237, 159;
            --glow: rgba(46, 213, 115, 0.45);
            --border-card: rgba(46, 213, 115, 0.35);
        }

        body[data-theme="pink"] {
            --primary: #ff4fa3;
            --primary-rgb: 255, 79, 163;
            --accent: #ffa1d0;
            --accent-rgb: 255, 161, 208;
            --glow: rgba(255, 79, 163, 0.45);
            --border-card: rgba(255, 79, 163, 0.35);
        }

        body[data-theme="ice"] {
            --primary: #a5f3fc;
            --primary-rgb: 165, 243, 252;
            --accent: #e0f2fe;
            --accent-rgb: 224, 242, 254;
            --glow: rgba(165, 243, 252, 0.4);
            --border-card: rgba(224, 242, 254, 0.45);
            --bg-card: rgba(20, 34, 52, 0.78);
        }

        body[data-theme="sunset"] {
            --primary: #ff7e5f;
            --primary-rgb: 255, 126, 95;
            --accent: #feb47b;
            --accent-rgb: 254, 180, 123;
            --glow: rgba(255, 126, 95, 0.45);
            --border-card: rgba(254, 180, 123, 0.4);
            --bg-card: rgba(30, 14, 20, 0.85);
        }

        /* --- TEMA SIMPLE (SOLO TIEMPO) --- */
        body[data-theme="simple"] {
            --primary: #ffffff;
            --primary-rgb: 255, 255, 255;
            --accent: #e0e0e0;
            --accent-rgb: 224, 224, 224;
            --glow: rgba(0, 0, 0, 0.9);
            --border-card: transparent;
            --bg-card: transparent;
        }

        body[data-theme="simple"] .timer-card {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            padding: 0 !important;
            min-width: auto !important;
        }

        body[data-theme="simple"] .timer-header {
            display: none !important;
        }

        body[data-theme="simple"] .timer-body {
            margin: 0 !important;
        }

        body[data-theme="simple"] .time-digits {
            font-size: 4rem;
            color: #ffffff;
            font-weight: 800;
            letter-spacing: 2px;
            /* Sombra nítida de alto contraste para máxima legibilidad sobre cualquier fondo de OBS */
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.95), 0 0 4px #000, 2px 2px 2px #000;
        }

        body[data-theme="simple"] .time-ms {
            font-size: 1.8rem;
            color: #ffffff;
            opacity: 0.85;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95), 0 0 4px #000;
        }

        body[data-theme="simple"] .add-stack {
            margin-top: 6px;
        }

        body[data-theme="simple"] .added-time-pill.neg {
            color: #ff4757;
        }

        body[data-theme="simple"] .added-time-pill {
            background: rgba(10, 10, 15, 0.92);
            color: #2ed573;
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.9);
            font-size: 0.8rem;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            background: transparent !important;
            background-color: transparent !important;
            font-family: 'Outfit', sans-serif;
            color: var(--text-color);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 8px;
            user-select: none;
            -webkit-user-select: none;
        }

        .drag-region {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 25px;
            -webkit-app-region: drag;
            z-index: 1000;
        }

        /* --- CONTENEDOR PRINCIPAL --- */
        .timer-card {
            background: var(--bg-card);
            border: 2px solid var(--border-card);
            border-radius: 16px;
            padding: 12px 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 20px var(--glow);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            min-width: 280px;
            max-width: 95vw;
            transition: border-color 0.3s, box-shadow 0.3s, transform 0.2s;
        }

        .timer-card.paused {
            border-color: rgba(255, 165, 2, 0.4);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 15px rgba(255, 165, 2, 0.25);
        }

        .timer-card.ended {
            border-color: var(--danger);
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.7), 0 0 25px rgba(255, 71, 87, 0.6);
            animation: pulse-ended 1.5s infinite;
        }

        @keyframes pulse-ended {
            0%, 100% { box-shadow: 0 0 15px rgba(255, 71, 87, 0.4); }
            50% { box-shadow: 0 0 30px rgba(255, 71, 87, 0.8); }
        }

        /* --- HEADER: ICONO + TITULO + BADGE --- */
        .timer-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            gap: 12px;
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0; /* permite recortar títulos largos */
        }

        .hourglass-icon {
            font-size: 1.3rem;
            color: var(--primary);
            filter: drop-shadow(0 0 8px var(--primary));
            transition: transform 0.3s;
        }

        .active .hourglass-icon {
            animation: spin-slow 8s linear infinite;
        }

        @keyframes spin-slow {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(180deg); }
            100% { transform: rotate(360deg); }
        }

        .timer-title {
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #ffffff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            /* Títulos largos: una línea con "…" en vez de crecer hacia abajo */
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-width: 0;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #aaa;
            flex-shrink: 0;
            white-space: nowrap;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #888;
        }

        .status-badge.active {
            background: rgba(46, 213, 115, 0.15);
            border-color: rgba(46, 213, 115, 0.4);
            color: #2ed573;
        }
        .status-badge.active .status-dot {
            background: #2ed573;
            box-shadow: 0 0 8px #2ed573;
            animation: blink 1.2s infinite;
        }

        .status-badge.paused {
            background: rgba(255, 165, 2, 0.15);
            border-color: rgba(255, 165, 2, 0.4);
            color: #ffa502;
        }
        .status-badge.paused .status-dot {
            background: #ffa502;
        }

        .status-badge.ended {
            background: rgba(255, 71, 87, 0.15);
            border-color: rgba(255, 71, 87, 0.4);
            color: #ff4757;
        }
        .status-badge.ended .status-dot {
            background: #ff4757;
            animation: blink 0.6s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* --- DISPLAY DE TIEMPO --- */
        /* Rejilla 1fr|reloj|ms|badge|1fr: el reloj queda centrado aunque el badge "+Xs" ocupe sitio a la derecha */
        .time-display-container {
            display: grid;
            grid-template-columns: 1fr auto auto 1fr; /* si falta sitio, la columna izq. cede primero */
            align-items: baseline;
            font-family: var(--timer-font, 'Orbitron'), monospace;
            font-weight: 900;
            line-height: 1;
            margin: 6px 0;
            text-shadow: 0 0 15px var(--glow);
        }

        .time-digits {
            grid-column: 2;
            font-size: 3.4rem;
            color: #ffffff;
            letter-spacing: 2px;
            font-variant-numeric: tabular-nums;
        }

        .time-ms {
            grid-column: 3;
            font-size: 1.6rem;
            color: var(--primary);
            opacity: 0.9;
            margin-left: 4px;
            font-variant-numeric: tabular-nums;
            display: none;
        }

        .time-ms.show {
            display: inline-block;
        }

        /* --- NOTIFICACIÓN FLOTANTE DE TIEMPO AÑADIDO --- */
        .add-stack {
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            margin-top: -14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            pointer-events: none;
            z-index: 100;
        }

        .added-time-pill {
            position: relative;
            max-width: 90vw;
            overflow: hidden;
            text-overflow: ellipsis;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #000;
            font-weight: 900;
            font-size: 0.8rem;
            padding: 4px 14px;
            border-radius: 20px;
            box-shadow: 0 4px 15px var(--glow);
            display: flex;
            align-items: center;
            gap: 6px;
            opacity: 0;
            transform: translateY(10px) scale(0.9);
            transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            white-space: nowrap;
            z-index: 100;
        }

        .added-time-pill span {
            overflow: hidden;
            text-overflow: ellipsis;
            min-width: 0;
        }

        .added-time-pill.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .added-time-pill.leaving {
            opacity: 0;
            transform: translateY(-6px) scale(0.95);
        }

        .added-time-pill.neg {
            background: linear-gradient(135deg, #ff4757, #c0392b);
            color: #fff;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.55);
        }

        /* Rebote del reloj al sumar / restar tiempo */
        .time-display-container.bump-add { animation: bump-add 0.45s ease-out; }
        .time-display-container.bump-sub { animation: bump-sub 0.45s ease-out; }
        @keyframes bump-add {
            0% { transform: scale(1); }
            35% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }
        @keyframes bump-sub {
            0% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            50% { transform: translateX(4px); }
            75% { transform: translateX(-2px); }
            100% { transform: translateX(0); }
        }

        /* Destello de color en los dígitos + badge "+Xs" al lado (igual que en la app) */
        .time-digits { transition: color 0.6s ease, text-shadow 0.6s ease; }
        .timer-card.flash-add .time-digits {
            color: #00ff88 !important;
            text-shadow: 0 0 12px rgba(0, 255, 136, 0.9) !important;
            transition: none;
        }
        .timer-card.flash-sub .time-digits {
            color: #ff4757 !important;
            text-shadow: 0 0 12px rgba(255, 71, 87, 0.9) !important;
            transition: none;
        }
        .time-delta-badge {
            grid-column: 4;
            justify-self: start;
            align-self: center;
            margin-left: 10px;
            padding: 3px 8px;
            border-radius: 6px;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: 0;
            text-shadow: none;
            color: #00ff88;
            background: rgba(0, 255, 136, 0.15);
            border: 1px solid rgba(0, 255, 136, 0.3);
            opacity: 0;
            transition: opacity 0.4s ease;
            white-space: nowrap;
        }
        .time-delta-badge.neg {
            color: #ff4757;
            background: rgba(255, 71, 87, 0.15);
            border-color: rgba(255, 71, 87, 0.3);
        }
        .time-delta-badge.show { opacity: 1; }
        body[data-hide-badge="1"] .time-delta-badge { display: none; }

        /* --- AVISO DE POCO TIEMPO --- */
        .timer-card.warn {
            border-color: rgba(255, 71, 87, 0.65);
            animation: warn-glow 2s ease-in-out infinite;
        }
        .timer-card.warn .time-digits {
            color: #ffc2c7;
            text-shadow: 0 0 14px rgba(255, 71, 87, 0.75), 0 2px 8px rgba(0, 0, 0, 0.9);
        }
        .timer-card.critical {
            border-color: var(--danger);
            animation: warn-glow 0.8s ease-in-out infinite;
        }
        .timer-card.critical .time-digits {
            color: #ff4757;
            text-shadow: 0 0 20px rgba(255, 71, 87, 0.95), 0 2px 8px rgba(0, 0, 0, 0.95);
            display: inline-block;
            animation: critical-beat 1s ease-in-out infinite;
        }
        @keyframes warn-glow {
            0%, 100% { box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 12px rgba(255, 71, 87, 0.35); }
            50% { box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 32px rgba(255, 71, 87, 0.85); }
        }
        @keyframes critical-beat {
            0%, 100% { transform: scale(1); }
            15% { transform: scale(1.07); }
            30% { transform: scale(1); }
        }

        /* --- INDICADOR DE PAUSA --- */
        .pause-indicator {
            display: none;
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 3px;
            color: #ffa502;
            opacity: 0.75;
            margin-top: 2px;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
            animation: blink 2.4s ease-in-out infinite;
        }
        .timer-card.paused .pause-indicator { display: block; }
        .timer-card.paused .time-digits { opacity: 0.8; }

        .timer-card.ended .time-digits { color: #ff8a94; }

        /* --- ALERTA DE FINALIZACIÓN --- */
        .time-up-banner {
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--danger);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 5px;
            text-align: center; /* endText largo: las 2 líneas centradas */
            display: none;
            animation: shake 0.5s ease-in-out infinite alternate;
        }

        @keyframes shake {
            0% { transform: translateX(-2px); }
            100% { transform: translateX(2px); }
        }

        /* --- MODO COMPACTO / MINIMALISTA (vía URL ?layout=compact) --- */
        body[data-layout="compact"] .timer-card {
            padding: 10px 18px;
            min-width: auto;
            border-radius: 14px;
        }
        body[data-layout="compact"] .time-digits {
            font-size: 2.2rem;
        }
        body[data-layout="compact"] .timer-header {
            margin-bottom: 4px;
            padding-bottom: 4px;
        }
        body[data-layout="compact"] .timer-title {
            font-size: 0.85rem;
        }

        body[data-layout="minimal"] .timer-card {
            background: transparent;
            border: none;
            box-shadow: none;
            backdrop-filter: none;
            padding: 0;
        }
        body[data-layout="minimal"] .timer-header {
            display: none;
        }
        body[data-layout="minimal"] .time-digits {
            font-size: 3.8rem;
            text-shadow: 0 2px 10px rgba(0,0,0,0.9), 0 0 20px var(--glow);
        }
    </style>
    <script src="./token-bridge.js"></script>
</head>
<body data-theme="neon">

    <div class="drag-region"></div>

    <div class="timer-card" id="timer-card">
        <!-- HEADER -->
        <div class="timer-header">
            <div class="header-left">
                <i class="fa-solid fa-hourglass-half hourglass-icon" id="hourglass-icon"></i>
                <span class="timer-title" id="timer-title">EXTENSIBLE</span>
            </div>
            <div class="status-badge" id="status-badge">
                <span class="status-dot"></span>
                <span id="status-text">PAUSADO</span>
            </div>
        </div>

        <!-- RELOJ -->
        <div class="time-display-container">
            <span class="time-digits" id="time-digits">01:00:00</span>
            <span class="time-ms" id="time-ms">.00</span>
            <span class="time-delta-badge" id="time-delta-badge"></span>
        </div>

        <div class="pause-indicator" id="pause-indicator"><i class="fa-solid fa-pause"></i> EN PAUSA</div>

        <div class="time-up-banner" id="time-up-banner">
            <i class="fa-solid fa-triangle-exclamation"></i> <span id="end-text">¡TIEMPO TERMINADO!</span>
        </div>

        <!-- NOTIFICACIONES DE TIEMPO AÑADIDO / RESTADO (apiladas) -->
        <div class="add-stack" id="add-stack"></div>
    </div>

    <script>
        // --- PARÁMETROS URL ---
        // theme, layout, showMs, title (existentes)
        // warn   = segundos para el aviso de poco tiempo (def. 300, 0 = desactivado)
        // endText= texto al terminar (def. "¡TIEMPO TERMINADO!")
        // color  = color de acento hex (ej. ff4fa3 o #ff4fa3)
        // size   = escala del widget (0.3 - 4, def. 1)
        // font   = fuente de Google Fonts para los dígitos (ej. "Bebas Neue")
        const urlParams = new URLSearchParams(window.location.search);
        const paramTheme = urlParams.get('theme');
        const paramLayout = urlParams.get('layout');
        const paramShowMs = urlParams.get('showMs');
        const paramTitle = urlParams.get('title');
        const paramWarn = urlParams.get('warn');
        const paramEndText = urlParams.get('endText');
        const paramColor = urlParams.get('color');
        const paramSize = urlParams.get('size');
        const paramFont = urlParams.get('font');

        if (paramTheme) document.body.setAttribute('data-theme', paramTheme);
        if (paramLayout) document.body.setAttribute('data-layout', paramLayout);
        if (urlParams.get('badge') === '0') document.body.setAttribute('data-hide-badge', '1'); // ?badge=0 oculta el "+Xs" junto al reloj

        let warnSeconds = 300;
        if (paramWarn !== null && paramWarn !== '' && !isNaN(Number(paramWarn))) {
            warnSeconds = Math.max(0, Number(paramWarn));
        }
        const CRITICAL_SECONDS = 60;

        // Color de acento personalizado
        (function applyAccentColor(raw) {
            if (!raw) return;
            let hex = String(raw).trim().replace(/^#/, '');
            if (/^[0-9a-fA-F]{3}$/.test(hex)) hex = hex.split('').map(c => c + c).join('');
            if (!/^[0-9a-fA-F]{6}$/.test(hex)) return;
            const r = parseInt(hex.slice(0, 2), 16);
            const g = parseInt(hex.slice(2, 4), 16);
            const b = parseInt(hex.slice(4, 6), 16);
            const mix = (c) => Math.round(c + (255 - c) * 0.35);
            const st = document.body.style;
            st.setProperty('--primary', `#${hex}`);
            st.setProperty('--primary-rgb', `${r}, ${g}, ${b}`);
            st.setProperty('--accent', `rgb(${mix(r)}, ${mix(g)}, ${mix(b)})`);
            st.setProperty('--accent-rgb', `${mix(r)}, ${mix(g)}, ${mix(b)}`);
            st.setProperty('--glow', `rgba(${r}, ${g}, ${b}, 0.45)`);
            if (document.body.getAttribute('data-theme') !== 'simple') {
                st.setProperty('--border-card', `rgba(${r}, ${g}, ${b}, 0.35)`);
            }
        })(paramColor);

        // Fuente personalizada (Google Fonts). Solo letras, números y espacios.
        (function applyFont(raw) {
            if (!raw) return;
            const name = String(raw).trim();
            if (!/^[A-Za-z0-9 ]{1,40}$/.test(name)) return;
            const link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = 'https://fonts.googleapis.com/css2?family=' + encodeURIComponent(name).replace(/%20/g, '+') + ':wght@400;700;900&display=swap';
            document.head.appendChild(link);
            document.body.style.setProperty('--timer-font', `'${name}'`);
        })(paramFont);

        // --- ELEMENTOS DEL DOM ---
        const cardEl = document.getElementById('timer-card');
        const titleEl = document.getElementById('timer-title');
        const badgeEl = document.getElementById('status-badge');
        const statusTextEl = document.getElementById('status-text');
        const digitsEl = document.getElementById('time-digits');
        const msEl = document.getElementById('time-ms');
        const timeUpBanner = document.getElementById('time-up-banner');
        const endTextEl = document.getElementById('end-text');
        const addStack = document.getElementById('add-stack');
        const timeContainer = document.querySelector('.time-display-container');

        if (paramEndText) endTextEl.textContent = paramEndText.slice(0, 60);

        // Escala del widget
        if (paramSize && !isNaN(Number(paramSize))) {
            const sz = Math.min(4, Math.max(0.3, Number(paramSize)));
            if (sz !== 1) cardEl.style.zoom = sz;
        }

        // --- ESTADO LOCAL ---
        // El tiempo mostrado se interpola desde el último valor recibido del servidor
        // (baseSeconds) y el instante en que llegó (baseAt). Cada actualización resincroniza.
        let baseSeconds = 3600;
        let baseAt = performance.now();
        let isRunning = false;
        let labelText = paramTitle || "EXTENSIBLE";
        let showMilliseconds = paramShowMs !== null ? paramShowMs === 'true' : false;
        let endedChimed = false;
        let firstSync = true;
        const seenAddKeys = [];

        function getRemaining() {
            if (!isRunning) return Math.max(0, baseSeconds);
            return Math.max(0, baseSeconds - (performance.now() - baseAt) / 1000);
        }

        // Sonido de alerta sintetizado (sin necesidad de archivos de audio externos)
        function playChime(freq = 880, duration = 0.15) {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + duration);
            } catch (e) {}
        }

        // Formatear segundos en HH:MM:SS y ms
        function formatTime(totalSecs) {
            const safeSecs = Math.max(0, totalSecs);
            const h = Math.floor(safeSecs / 3600);
            const m = Math.floor((safeSecs % 3600) / 60);
            const s = Math.floor(safeSecs % 60);
            const ms = Math.floor((safeSecs % 1) * 100);

            const hStr = h.toString().padStart(2, '0');
            const mStr = m.toString().padStart(2, '0');
            const sStr = s.toString().padStart(2, '0');
            const msStr = '.' + ms.toString().padStart(2, '0');

            return { timeStr: `${hStr}:${mStr}:${sStr}`, msStr };
        }

        // "+30s", "+5m", "+1m 30s", "+1.5h", "-10s"
        function formatDelta(seconds) {
            const sign = seconds < 0 ? '-' : '+';
            const abs = Math.abs(seconds);
            if (abs < 1) {
                const v = Math.round(abs * 10) / 10 || Math.round(abs * 100) / 100;
                return `${sign}${v}s`;
            }
            if (abs < 10) return `${sign}${Math.round(abs * 10) / 10}s`;
            if (abs < 60) return `${sign}${Math.round(abs)}s`;
            if (abs < 3600) {
                const m = Math.floor(abs / 60);
                const s = Math.round(abs % 60);
                return s ? `${sign}${m}m ${s}s` : `${sign}${m}m`;
            }
            return `${sign}${Math.round(abs / 3600 * 10) / 10}h`;
        }

        function clip(str, n) {
            str = String(str == null ? '' : str).trim();
            return str.length > n ? str.slice(0, n - 1) + '…' : str;
        }

        // --- COLA DE NOTIFICACIONES (+Xs / -Xs) ---
        const MAX_VISIBLE_PILLS = 3;
        const addQueue = [];
        let visiblePills = 0;
        let pumpTimer = null;
        let lastPillAt = 0;

        function enqueueAdded(seconds, user, reason) {
            seconds = Number(seconds);
            if (!seconds || isNaN(seconds)) return;
            flashDigits(seconds); // inmediato, sin esperar a la cola de avisos
            addQueue.push({ seconds, user, reason });
            // Límite de seguridad: si llega una avalancha, se conservan las 60 más recientes
            if (addQueue.length > 60) addQueue.splice(0, addQueue.length - 60);
            pumpQueue();
        }

        function pumpQueue() {
            if (pumpTimer || !addQueue.length || visiblePills >= MAX_VISIBLE_PILLS) return;
            const wait = Math.max(0, lastPillAt + 280 - Date.now());
            pumpTimer = setTimeout(() => {
                pumpTimer = null;
                if (!addQueue.length || visiblePills >= MAX_VISIBLE_PILLS) return;
                lastPillAt = Date.now();
                spawnPill(addQueue.shift());
                pumpQueue();
            }, wait);
        }

        // Dígitos en verde (rojo si se resta) ~1.5s y badge "+Xs" junto al reloj ~2s
        let flashTimer = null;
        let badgeTimer = null;
        function flashDigits(seconds) {
            const isNeg = seconds < 0;
            const card = document.getElementById('timer-card');
            const badge = document.getElementById('time-delta-badge');
            if (card) {
                card.classList.remove('flash-add', 'flash-sub');
                card.classList.add(isNeg ? 'flash-sub' : 'flash-add');
                clearTimeout(flashTimer);
                flashTimer = setTimeout(() => card.classList.remove('flash-add', 'flash-sub'), 1500);
            }
            if (badge) {
                badge.textContent = formatDelta(seconds);
                badge.classList.toggle('neg', isNeg);
                badge.classList.add('show');
                clearTimeout(badgeTimer);
                badgeTimer = setTimeout(() => badge.classList.remove('show'), 2000);
            }
        }

        function spawnPill(item) {
            const isNeg = item.seconds < 0;
            let text = formatDelta(item.seconds);
            const user = clip(item.user, 24);
            const reason = clip(item.reason, 32);
            const showUser = user && user !== 'Admin' && user !== 'User';
            const showReason = reason && reason.toLowerCase() !== 'manual';
            if (showUser) text += ` · ${user}`;
            if (showReason) text += showUser ? ` (${reason})` : ` · ${reason}`;

            const pill = document.createElement('div');
            pill.className = 'added-time-pill' + (isNeg ? ' neg' : '');
            const icon = document.createElement('i');
            icon.className = isNeg ? 'fa-solid fa-minus' : 'fa-solid fa-bolt';
            const span = document.createElement('span');
            span.textContent = text;
            pill.appendChild(icon);
            pill.appendChild(span);
            addStack.appendChild(pill);
            visiblePills++;

            // Rebote del reloj
            timeContainer.classList.remove('bump-add', 'bump-sub');
            void timeContainer.offsetWidth;
            timeContainer.classList.add(isNeg ? 'bump-sub' : 'bump-add');

            void pill.offsetWidth;
            setTimeout(() => pill.classList.add('show'), 20);

            // Si hay cola, se acortan los tiempos para no acumular retraso
            const life = addQueue.length > 6 ? 1500 : (addQueue.length > 2 ? 2400 : 3500);
            setTimeout(() => {
                pill.classList.add('leaving');
                pill.classList.remove('show');
                setTimeout(() => {
                    if (pill.parentNode) pill.parentNode.removeChild(pill);
                    visiblePills = Math.max(0, visiblePills - 1);
                    pumpQueue();
                }, 380);
            }, life);
        }

        // Actualizar la interfaz visual
        let lastRenderedState = '';
        let lastRenderedTitle = null;
        let lastTimeStr = '';
        let lastMsStr = '';
        let lastUrgency = '';

        function renderUI() {
            const remaining = getRemaining();

            if (labelText !== lastRenderedTitle) {
                lastRenderedTitle = labelText;
                titleEl.textContent = labelText;
            }

            const { timeStr, msStr } = formatTime(remaining);
            if (timeStr !== lastTimeStr) { lastTimeStr = timeStr; digitsEl.textContent = timeStr; }
            if (showMilliseconds && msStr !== lastMsStr) { lastMsStr = msStr; msEl.textContent = msStr; }
            msEl.classList.toggle('show', showMilliseconds);

            // Estado (solo mutar DOM si el estado realmente cambia)
            let newState = 'paused';
            if (remaining <= 0) newState = 'ended';
            else if (isRunning) newState = 'active';

            if (newState !== lastRenderedState) {
                lastRenderedState = newState;
                cardEl.classList.remove('active', 'paused', 'ended');
                badgeEl.classList.remove('active', 'paused', 'ended');
                cardEl.classList.add(newState);
                badgeEl.classList.add(newState);

                if (newState === 'ended') {
                    statusTextEl.textContent = 'FINALIZADO';
                    timeUpBanner.style.display = 'block';
                } else if (newState === 'active') {
                    statusTextEl.textContent = 'ACTIVO';
                    timeUpBanner.style.display = 'none';
                } else {
                    statusTextEl.textContent = 'PAUSADO';
                    timeUpBanner.style.display = 'none';
                }
            }

            // Aviso de poco tiempo (solo mientras corre)
            let urgency = '';
            if (newState === 'active' && warnSeconds > 0 && remaining < warnSeconds) {
                urgency = remaining < Math.min(CRITICAL_SECONDS, warnSeconds) ? 'critical' : 'warn';
            }
            if (urgency !== lastUrgency) {
                lastUrgency = urgency;
                cardEl.classList.remove('warn', 'critical');
                if (urgency === 'critical') cardEl.classList.add('warn', 'critical');
                else if (urgency === 'warn') cardEl.classList.add('warn');
            }
        }

        // --- TICKER INTERPOLADO ---
        setInterval(() => {
            if (isRunning && getRemaining() <= 0) {
                baseSeconds = 0;
                baseAt = performance.now();
                isRunning = false;
                if (!endedChimed) { endedChimed = true; playChime(440, 0.5); }
            }
            renderUI();
        }, 50);

        // --- CONEXIÓN SOCKET.IO ---
        const streamToken = urlParams.get('token') || 'default';
        const socketHost = (typeof window !== 'undefined' && window.location && window.location.origin) ? window.location.origin : '';
        const socket = io(socketHost, {
            query: { token: streamToken },
            reconnection: true,
            reconnectionAttempts: Infinity,
            reconnectionDelay: 1000
        });
        window.socket = socket;

        socket.on('connect', () => {
            console.log('[Extensible] Conectado a Render en sala:', streamToken);
            socket.emit('join-room', streamToken);
            socket.emit('get_data', streamToken);
        });

        function handleExtensibleUpdate(ext) {
            if (!ext) return;

            const hasTime = ext.time !== undefined && ext.time !== null && !isNaN(Number(ext.time));
            if (!hasTime && ext.active !== undefined) {
                // Congelar el valor interpolado antes de cambiar de estado
                baseSeconds = getRemaining();
                baseAt = performance.now();
            }

            // Sincronizar estado activo/pausado
            if (ext.active !== undefined) {
                isRunning = !!ext.active;
            }

            // Sincronizar tiempo del servidor (resincroniza la interpolación)
            if (hasTime) {
                // Compensar la latencia desde que la app envió el dato (evita saltos hacia atrás).
                // Tope de 30s por si el payload viene de un estado guardado en disco (sentAt antiguo).
                const sentLag = (ext.active && ext.sentAt) ? Math.min(30, Math.max(0, (Date.now() - Number(ext.sentAt)) / 1000)) : 0;
                baseSeconds = Math.max(0, Number(ext.time) - (isNaN(sentLag) ? 0 : sentLag));
                baseAt = performance.now();
                if (baseSeconds > 0) endedChimed = false;
            }

            // Sincronizar título
            if (ext.label !== undefined && !paramTitle) {
                labelText = ext.label || "EXTENSIBLE";
            }

            // Sincronizar milisegundos
            if (ext.showMs !== undefined && paramShowMs === null) {
                showMilliseconds = !!ext.showMs;
            }

            // Sincronizar tema de color si no está forzado por URL
            if (ext.theme && !paramTheme) {
                document.body.setAttribute('data-theme', ext.theme);
            }

            // Detectar adiciones de tiempo nuevas (sin duplicar ni perder ninguna)
            const la = ext.lastAdded;
            if (la && la.ts) {
                const key = `${la.ts}|${la.seconds}|${la.user}|${la.reason}`;
                if (seenAddKeys.indexOf(key) === -1) {
                    seenAddKeys.push(key);
                    if (seenAddKeys.length > 80) seenAddKeys.shift();
                    // En la primera carga, no repetir una adición antigua
                    const stale = firstSync && (Date.now() - Number(la.ts) > 15000);
                    if (!stale) enqueueAdded(la.seconds, la.user, la.reason);
                }
            }
            firstSync = false;

            renderUI();
        }

        let lastExtDataAt = 0;
        socket.on('extensible_data', (ext) => {
            lastExtDataAt = Date.now();
            handleExtensibleUpdate(ext);
        });

        socket.on('data', (data) => {
            if (!data || !data.extensible) return;
            // Si acaba de llegar un 'extensible_data' (canal rápido), ignorar el tiempo de este paquete (puede venir atrasado)
            if (Date.now() - lastExtDataAt < 1500) {
                const ext = Object.assign({}, data.extensible);
                delete ext.time;
                handleExtensibleUpdate(ext);
                return;
            }
            handleExtensibleUpdate(data.extensible);
        });

        // Recargar el widget instantáneamente cuando el usuario guarde cambios en la app
        socket.on('reload_overlays', () => {
            location.reload();
        });

        // Primer render inmediato
        renderUI();
    </script>
</body>
</html>
