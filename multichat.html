<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Multi-Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --dark-bg: #18181b;
            --dark-text: #e4e4e7;
            --dark-panel: #27272a;
            --dark-border: #3f3f46;
            --light-bg: #f4f4f5;
            --light-text: #18181b;
            --light-panel: #ffffff;
            --light-border: #d4d4d8;
            --primary-blue: #3b82f6;
            --primary-red: #ef4444;
            --font-size: 20px;
            --emote-size: 28px;
            --anim-duration: 0.3s;
        }

        body.dark {
            --bg-color: var(--dark-bg);
            --text-color: var(--dark-text);
            --panel-color: var(--dark-panel);
            --border-color: var(--dark-border);
            --hover-bg: rgba(255, 255, 255, 0.1);
            --redeem-subtle: #adadb8;
            --redeem-title: #ffffff;
            --redeem-cost: #00f5d4;
        }

        body.light {
            --bg-color: var(--light-bg);
            --text-color: var(--light-text);
            --panel-color: var(--light-panel);
            --border-color: var(--light-border);
            --hover-bg: rgba(0, 0, 0, 0.05);
            --redeem-subtle: #53535f;
            --redeem-title: #0e0e10;
            --redeem-cost: #008779;
        }

        body {
            font-family: 'Open Sans', Arial, sans-serif;
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background-color: var(--panel-color);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        .header h3 {
            margin: 0;
            font-size: 1rem;
            font-weight: bold;
        }

        .controls {
            display: flex;
            gap: 8px;
        }

        .btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn:hover {
            background-color: rgba(128, 128, 128, 0.1);
        }

        .btn.active {
            background-color: var(--primary-blue);
            color: white;
            border-color: var(--primary-blue);
        }

        .btn-danger {
            border-color: var(--primary-red);
            color: var(--primary-red);
        }

        .btn-danger:hover {
            background-color: rgba(239, 68, 68, 0.2);
        }

        .filter-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 4px 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .filter-btn:hover {
            background-color: rgba(128, 128, 128, 0.1);
        }

        .filter-btn.inactive {
            opacity: 0.4;
            filter: grayscale(100%);
        }

        #chat-container {
            flex-grow: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 15px;
            display: flex;
            flex-direction: column;
            font-size: var(--font-size);
        }

        .chat-line {
            padding: 2px 8px;
            background-color: transparent;
            border-radius: 4px;
            line-height: 1.3;
            word-wrap: break-word;
            overflow-wrap: anywhere;
            cursor: pointer;
            transition: all 0.2s;
            animation: slideIn var(--anim-duration) cubic-bezier(0.25, 1, 0.5, 1) forwards;
            width: fit-content;
            max-width: 100%;
            transform-origin: bottom left;
            border-left: 3px solid transparent;
        }

        .chat-line:first-child {
            margin-top: auto;
        }

        .chat-line:hover {
            background-color: var(--hover-bg);
        }

        .chat-line.speaking {
            background-color: rgba(59, 130, 246, 0.2);
            border-left-color: var(--primary-blue);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
        }

        /* Widget Estilos Replicados */
        .badges {
            display: inline-flex;
            align-items: center;
            vertical-align: middle;
            margin-right: 3px;
        }

        .badge {
            width: 16px;
            height: 16px;
            margin-right: 2px;
            margin-bottom: 3px;
            border-radius: 10%;
        }

        .platform-icon {
            margin-right: 6px;
            display: inline-block;
            vertical-align: middle;
            font-size: 0.9em;
        }

        .message-body {
            display: inline;
            word-wrap: break-word;
        }

        .username {
            font-weight: 800;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.45);
        }

        body.light .username {
            text-shadow: none;
        }

        .colon {
            color: var(--text-color);
            font-weight: 800;
            margin-right: 6px;
        }

        .message-content {
            font-weight: 800;
            color: var(--text-color);
        }

        .emote-container {
            display: inline-block;
        }

        .emote {
            max-width: calc(var(--emote-size) * 4);
            height: var(--emote-size);
            margin-right: -3px;
            vertical-align: middle;
            display: inline-block;
            margin-top: -4px;
        }

        /* Stickers de TikTok enviados solos (WebcastEmoteChatMessage / mensaje sin texto) */
        .emote.tiktok-sticker {
            height: calc(var(--emote-size) * 2);
            max-width: calc(var(--emote-size) * 4);
            margin-top: 2px;
            margin-right: 2px;
            object-fit: contain;
        }

        .chat-gif-wrapper {
            display: block;
            margin: 6px 0;
        }

        img.gif,
        .chat-gif {
            max-height: 140px;
            max-width: 240px;
            border-radius: 8px;
            object-fit: contain;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            vertical-align: middle;
            display: inline-block;
            margin: 4px 0;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 4px;
        }

        .hidden-platform {
            display: none !important;
        }

        .hidden-gift {
            display: none !important;
        }
    </style>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        if (typeof io === 'undefined') {
            document.write('<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"><\/script>');
        }
    </script>
    <script src="./token-bridge.js"></script>
</head>

<body class="dark" id="body-theme">
    <div class="header">
        <div style="display: flex; align-items: center; gap: 6px;">
            <span id="conn-status" title="Conexión en espera" style="width: 9px; height: 9px; border-radius: 50%; background: #00f5d4; display: inline-block; box-shadow: 0 0 6px #00f5d4; flex-shrink: 0;"></span>
            <i class="fa-solid fa-filter" style="color: #888; margin-right: 2px;" title="Filtros"></i>
            <div style="display: flex; gap: 4px;">
                <button class="filter-btn" onclick="changeFontSize(-1)" title="Reducir Letra"><i
                        class="fa-solid fa-minus"></i></button>
                <button class="filter-btn" onclick="changeFontSize(1)" title="Aumentar Letra"><i
                        class="fa-solid fa-plus"></i></button>
                <div style="width: 1px; background: var(--border-color); margin: 0 5px;"></div>
                <button id="filter-tiktok" class="filter-btn" onclick="toggleFilter('tiktok')"
                    style="color: #ff0050; border-color: rgba(255, 0, 80, 0.5);" title="Alternar TikTok"><i
                        class="fa-brands fa-tiktok"></i></button>
                <button id="filter-twitch" class="filter-btn" onclick="toggleFilter('twitch')"
                    style="color: #9146FF; border-color: rgba(145, 70, 255, 0.5);" title="Alternar Twitch"><i
                        class="fa-brands fa-twitch"></i></button>
                <button id="filter-kick" class="filter-btn" onclick="toggleFilter('kick')"
                    style="color: #53fc18; border-color: rgba(83, 252, 24, 0.5);" title="Alternar Kick"><i
                        class="fa-brands fa-kickstarter"></i></button>
            </div>
        </div>
        <div class="controls">
            <button id="btn-tts-pause" class="btn" onclick="sendTtsControl('toggle-pause')"><i
                    class="fa-solid fa-pause"></i> Pausar</button>
            <button class="btn btn-danger" onclick="sendTtsControl('skip-queue')"><i
                    class="fa-solid fa-forward-step"></i> Omitir</button>
            <button id="btn-theme" class="btn" onclick="toggleTheme()" title="Modo Claro/Oscuro"><i
                    class="fa-solid fa-sun"></i></button>
        </div>
    </div>
    <div id="stream-stats"
        style="position: fixed; top: 55px; right: 15px; background: rgba(20, 20, 20, 0.85); color: white; padding: 8px 15px; border-radius: 20px; font-family: 'Segoe UI', sans-serif; z-index: 9999; display: flex; gap: 15px; font-weight: bold; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(5px); box-shadow: 0 4px 6px rgba(0,0,0,0.3); pointer-events: none;">
        <div style="display: flex; align-items: center; gap: 6px;">
            <span style="color: #ff4757; font-size: 1.1rem;">❤️</span>
            <span id="stats-likes" style="font-size: 1rem; text-shadow: 1px 1px 2px black;">0</span>
        </div>
        <div style="display: flex; align-items: center; gap: 6px;">
            <span style="color: #1e90ff; font-size: 1.1rem;">👁️</span>
            <span id="stats-viewers" style="font-size: 1rem; text-shadow: 1px 1px 2px black;">0</span>
        </div>
    </div>
    <div id="chat-container">
        <div style="text-align: center; color: #888; margin-top: auto; margin-bottom: auto;">Esperando mensajes...</div>
    </div>
    <button id="btn-scroll-bottom" onclick="scrollToBottom(true)"
        style="display: none; position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; background: #9146FF; color: white; border: none; border-radius: 20px; padding: 7px 16px; font-weight: bold; font-size: 0.85rem; box-shadow: 0 4px 14px rgba(0,0,0,0.6); cursor: pointer; align-items: center; gap: 6px; transition: opacity 0.2s ease;">
        <i class="fa-solid fa-arrow-down"></i> Más recientes
    </button>
    <script>
        // --- LÓGICA DEL TEMA ---
        function toggleTheme() {
            const body = document.getElementById('body-theme');
            body.classList.toggle('dark');
            body.classList.toggle('light');
            const isDark = body.classList.contains('dark');
            document.getElementById('btn-theme').innerHTML = isDark ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
            localStorage.setItem('multichat_theme', isDark ? 'dark' : 'light');
            if (typeof updateAllUsernameColors === 'function') updateAllUsernameColors(!isDark);
        }
        if (localStorage.getItem('multichat_theme') === 'light') {
            document.getElementById('body-theme').classList.remove('dark');
            document.getElementById('body-theme').classList.add('light');
            window.addEventListener('DOMContentLoaded', () => {
                const btn = document.getElementById('btn-theme');
                if (btn) btn.innerHTML = '<i class="fa-solid fa-moon"></i>';
                if (typeof updateAllUsernameColors === 'function') updateAllUsernameColors(true);
            });
        }

        // --- LÓGICA DE TAMAÑO DE LETRA ---
        let currentFontSize = parseInt(localStorage.getItem('multichat_fontsize')) || 20;
        document.documentElement.style.setProperty('--font-size', currentFontSize + 'px');

        function changeFontSize(delta) {
            currentFontSize += delta;
            if (currentFontSize < 12) currentFontSize = 12;
            if (currentFontSize > 40) currentFontSize = 40;
            document.documentElement.style.setProperty('--font-size', currentFontSize + 'px');
            localStorage.setItem('multichat_fontsize', currentFontSize);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // --- LÓGICA DEL FILTRO DE PLATAFORMAS ---
        const platformFilters = { tiktok: true, twitch: true, kick: true };
        function toggleFilter(platform) {
            platformFilters[platform] = !platformFilters[platform];
            const btn = document.getElementById(`filter-${platform}`);
            if (platformFilters[platform]) btn.classList.remove('inactive');
            else btn.classList.add('inactive');

            document.querySelectorAll('.chat-line').forEach(el => {
                if (el.dataset.platform === platform) {
                    if (platformFilters[platform]) el.classList.remove('hidden-platform');
                    else el.classList.add('hidden-platform');
                }
            });
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // --- VISIBILIDAD DE REGALOS DE TIKTOK (CONTROLADO DESDE EL PANEL TTS CHAT) ---
        let showTikTokGifts = localStorage.getItem('multichat_show_tiktok_gifts') !== 'false';

        function applyTikTokGiftsVisibility(visible) {
            showTikTokGifts = Boolean(visible);
            localStorage.setItem('multichat_show_tiktok_gifts', showTikTokGifts ? 'true' : 'false');

            document.querySelectorAll('.chat-line[data-is-gift="true"]').forEach(el => {
                if (showTikTokGifts) el.classList.remove('hidden-gift');
                else el.classList.add('hidden-gift');
            });
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        window.addEventListener('storage', (e) => {
            if (e.key === 'multichat_show_tiktok_gifts') {
                applyTikTokGiftsVisibility(e.newValue !== 'false');
            }
        });

        function sendTtsControl(action) {
            if (socket && socket.connected) {
                socket.emit('tts-control', action);
            }
            if (window.parent && window.parent !== window) {
                try { window.parent.postMessage({ channel: 'tts-control', action }, '*'); } catch (e) { }
            }
            if (typeof require !== 'undefined') {
                try { const { ipcRenderer } = require('electron'); ipcRenderer.send('tts-control', action); } catch (e) { }
            }
        }

        function updateConnStatus(connected, info = '') {
            const el = document.getElementById('conn-status');
            if (!el) return;
            if (connected) {
                el.style.background = '#00f5d4';
                el.style.boxShadow = '0 0 8px #00f5d4';
                el.title = 'Conectado en tiempo real' + (info ? ` (${info})` : '');
            } else {
                el.style.background = '#ffb703';
                el.style.boxShadow = '0 0 8px #ffb703';
                el.title = 'Reconectando o escuchando por puente interno...';
            }
        }

        const urlParams = new URLSearchParams(window.location.search);
        const streamToken = urlParams.get('token') || 'default';
        const socketHost = (typeof window !== 'undefined' && window.location && window.location.origin && window.location.origin !== 'null' && !window.location.origin.startsWith('file:')) ? window.location.origin : 'http://localhost:3011';
        let socket = null;
        if (typeof io !== 'undefined') {
            try {
                socket = io(socketHost, {
                    query: { token: streamToken },
                    reconnection: true,
                    reconnectionAttempts: Infinity,
                    reconnectionDelay: 1000
                });
            } catch (err) {
                console.error('[Multichat] Error al inicializar socket:', err);
                try {
                    socket = io('http://localhost:3011', { query: { token: streamToken } });
                } catch (e) {
                    console.error('[Multichat] Error en socket fallback:', e);
                }
            }
        }
        const chatContainer = document.getElementById('chat-container');

        let emotes = {};
        let twitchBadgesMap = {};

        const USER_COLORS = [
            '#e11d48', '#ea580c', '#d97706', '#ca8a04', '#65a30d',
            '#16a34a', '#059669', '#0d9488', '#0891b2', '#0284c7',
            '#2563eb', '#4f46e5', '#7c3aed', '#9333ea', '#c026d3',
            '#db2777', '#f43f5e', '#f97316', '#14b8a6', '#6366f1'
        ];

        function getUserColor(username) {
            let hash = 0;
            const str = String(username || 'user');
            for (let i = 0; i < str.length; i++) { hash = str.charCodeAt(i) + ((hash << 5) - hash); }
            return USER_COLORS[Math.abs(hash % USER_COLORS.length)];
        }

        function parseColorToRgb(colorStr) {
            if (!colorStr) return { r: 128, g: 128, b: 128 };
            colorStr = String(colorStr).trim();
            if (colorStr.startsWith('#')) {
                let hex = colorStr.slice(1);
                if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
                if (hex.length === 6) {
                    const num = parseInt(hex, 16);
                    if (!isNaN(num)) return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
                }
            }
            const match = colorStr.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/i);
            if (match) {
                return { r: parseInt(match[1], 10), g: parseInt(match[2], 10), b: parseInt(match[3], 10) };
            }
            return { r: 128, g: 128, b: 128 };
        }

        function rgbToHsl(r, g, b) {
            r /= 255; g /= 255; b /= 255;
            const max = Math.max(r, g, b), min = Math.min(r, g, b);
            let h, s, l = (max + min) / 2;
            if (max === min) {
                h = s = 0;
            } else {
                const d = max - min;
                s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                switch (max) {
                    case r: h = ((g - b) / d + (g < b ? 6 : 0)) / 6; break;
                    case g: h = ((b - r) / d + 2) / 6; break;
                    case b: h = ((r - g) / d + 4) / 6; break;
                }
            }
            return { h: Math.round(h * 360), s: Math.round(s * 100), l: Math.round(l * 100) };
        }

        function hslToHex(h, s, l) {
            h = (h % 360 + 360) % 360;
            s = Math.max(0, Math.min(100, s)) / 100;
            l = Math.max(0, Math.min(100, l)) / 100;
            const c = (1 - Math.abs(2 * l - 1)) * s;
            const x = c * (1 - Math.abs((h / 60) % 2 - 1));
            const m = l - c / 2;
            let r = 0, g = 0, b = 0;
            if (0 <= h && h < 60) { r = c; g = x; b = 0; }
            else if (60 <= h && h < 120) { r = x; g = c; b = 0; }
            else if (120 <= h && h < 180) { r = 0; g = c; b = x; }
            else if (180 <= h && h < 240) { r = 0; g = x; b = c; }
            else if (240 <= h && h < 300) { r = x; g = 0; b = c; }
            else if (300 <= h && h < 360) { r = c; g = 0; b = x; }
            const toHex = (n) => {
                const hex = Math.round((n + m) * 255).toString(16);
                return hex.length === 1 ? '0' + hex : hex;
            };
            return `#${toHex(r)}${toHex(g)}${toHex(b)}`;
        }

        function isCurrentThemeLight() {
            const body = document.getElementById('body-theme') || document.body;
            return body ? body.classList.contains('light') : false;
        }

        function getAccessibleUserColor(rawColor, isLightMode) {
            if (!rawColor) return isLightMode ? '#0284c7' : '#38bdf8';
            const { r, g, b } = parseColorToRgb(rawColor);
            let { h, s, l } = rgbToHsl(r, g, b);

            // Colores casi acromáticos (blancos, grises, negros)
            if (s < 12) {
                return isLightMode ? '#1e293b' : '#f1f5f9';
            }

            if (isLightMode) {
                // MODO CLARO:
                // Previene que los colores sean pálidos, fluorescentes o chillones sobre fondo blanco
                s = Math.max(70, Math.min(95, s));

                if (h >= 35 && h <= 185) {
                    // Amarillos, dorados, verdes y cianes (altísima luminancia percibida)
                    // Se bajan a 24% - 33% para que queden colores intensos, elegantes y perfectamente legibles
                    l = Math.max(24, Math.min(33, l));
                } else if ((h >= 0 && h < 35) || (h > 300 && h <= 360)) {
                    // Rojos, corales, rosas y magentas
                    l = Math.max(30, Math.min(38, l));
                } else {
                    // Azules y púrpuras
                    l = Math.max(34, Math.min(44, l));
                }
            } else {
                // MODO OSCURO:
                // Previene colores negros/azules oscuros invisibles y suaviza neones cegadores
                if (h >= 200 && h <= 285) {
                    // Azules y violetas oscuros: elevar luminosidad para resaltar
                    l = Math.max(64, Math.min(75, l));
                    s = Math.max(75, Math.min(95, s));
                } else if (h >= 40 && h <= 185) {
                    // Verdes y amarillos chillones
                    l = Math.max(48, Math.min(60, l));
                    s = Math.min(85, s);
                } else {
                    // Rojos, rosas, naranjas
                    l = Math.max(58, Math.min(70, l));
                    s = Math.max(75, Math.min(95, s));
                }
            }

            return hslToHex(h, s, l);
        }

        function updateAllUsernameColors(isLight) {
            document.querySelectorAll('.username[data-raw-color]').forEach(el => {
                const raw = el.dataset.rawColor;
                if (raw) {
                    el.style.color = getAccessibleUserColor(raw, isLight);
                }
            });
        }

        // --- SISTEMA DE EMOTES (7TV, BTTV, FFZ) ---
        function addEmotes(newEmotes) { Object.assign(emotes, newEmotes); }
        async function fetchGlobalEmotes() {
            try { const res = await fetch('https://7tv.io/v3/emote-sets/global'); const data = await res.json(); if (data.emotes) { const map = {}; data.emotes.forEach(e => map[e.name] = `https://cdn.7tv.app/emote/${e.id}/2x.webp`); addEmotes(map); } } catch (e) { }
            try { const res = await fetch('https://api.betterttv.net/3/cached/emotes/global'); const data = await res.json(); if (Array.isArray(data)) { const map = {}; data.forEach(e => map[e.code] = `https://cdn.betterttv.net/emote/${e.id}/2x`); addEmotes(map); } } catch (e) { }
            try { const res = await fetch('https://api.frankerfacez.com/v1/set/global'); const data = await res.json(); if (data.sets && data.sets[3]) { const map = {}; data.sets[3].emoticons.forEach(e => map[e.name] = `https://cdn.frankerfacez.com/emote/${e.id}/2`); addEmotes(map); } } catch (e) { }
        }
        async function fetchChannelEmotes(broadcasterId) {
            if (!broadcasterId) return;
            try { const res = await fetch(`https://7tv.io/v3/users/twitch/${broadcasterId}`); const data = await res.json(); if (data.emote_set && data.emote_set.emotes) { const map = {}; data.emote_set.emotes.forEach(e => map[e.name] = `https://cdn.7tv.app/emote/${e.id}/2x.webp`); addEmotes(map); } } catch (e) { }
            try { const res = await fetch(`https://api.betterttv.net/3/cached/users/twitch/${broadcasterId}`); const data = await res.json(); const map = {}; if (data.channelEmotes) data.channelEmotes.forEach(e => map[e.code] = `https://cdn.betterttv.net/emote/${e.id}/2x`); if (data.sharedEmotes) data.sharedEmotes.forEach(e => map[e.code] = `https://cdn.betterttv.net/emote/${e.id}/2x`); addEmotes(map); } catch (e) { }
            try { const res = await fetch(`https://api.frankerfacez.com/v1/room/id/${broadcasterId}`); const data = await res.json(); if (data.sets) { const map = {}; Object.values(data.sets).forEach(set => { if (set.emoticons) set.emoticons.forEach(e => map[e.name] = `https://cdn.frankerfacez.com/emote/${e.id}/2`); }); addEmotes(map); } } catch (e) { }
        }
        fetchGlobalEmotes();

        // --- CONTADORES DE STATS (LIKES Y VIEWERS) ---
        let currentLocalLikes = 0;
        let currentLocalViewers = 0;

        function formatNumberStats(num) {
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num;
        }

        let cachedGifts = [];
        const activeGiftCombos = new Map();
        if (socket) {
            socket.on('connect', () => {
                updateConnStatus(true, 'Socket');
                socket.emit('join-room', streamToken);
                socket.emit('get_data', streamToken);
                socket.emit('request-twitch-status', streamToken);
            });
            socket.on('disconnect', () => {
                updateConnStatus(false);
            });
            socket.on('data', (data) => {
                if (data && data.gifts && Array.isArray(data.gifts)) {
                    cachedGifts = data.gifts;
                }
                if (data.sessionGlobalLikes !== undefined) {
                    const lk = parseInt(data.sessionGlobalLikes, 10) || 0;
                    if (lk > currentLocalLikes) {
                        currentLocalLikes = lk;
                        document.getElementById('stats-likes').innerText = formatNumberStats(currentLocalLikes);
                    }
                }
                if (data.viewerCount !== undefined) {
                    const vc = parseInt(data.viewerCount, 10) || 0;
                    if (vc > 0) {
                        currentLocalViewers = vc;
                        document.getElementById('stats-viewers').innerText = formatNumberStats(currentLocalViewers);
                    }
                }
            });
            socket.on('viewer_count', (count) => {
                const vc = parseInt(count, 10) || 0;
                if (vc > 0) {
                    currentLocalViewers = vc;
                    document.getElementById('stats-viewers').innerText = formatNumberStats(currentLocalViewers);
                }
            });
            socket.on('new-gift-discovered', (gift) => {
                if (gift && !cachedGifts.find(g => String(g.id) === String(gift.id))) {
                    cachedGifts.push(gift);
                }
            });
            socket.on('like_event', (data) => {
                const total = parseInt(data.totalLikeCount || data.total_like_count || data.totalLikes || data.total || 0, 10);
                if (total > currentLocalLikes) {
                    currentLocalLikes = total;
                } else if (data.likeCount) {
                    currentLocalLikes += parseInt(data.likeCount, 10);
                }
                document.getElementById('stats-likes').innerText = formatNumberStats(currentLocalLikes);
            });
        }

        function escapeHtml(text) {
            if (!text) return '';
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // --- MOTOR DE DIBUJADO DE MENSAJES CON DEDUPLICACIÓN ---
        let userHasScrolledUp = false;
        let isUserDraggingScrollbar = false;

        function updateScrollBtn() {
            const scrollBtn = document.getElementById('btn-scroll-bottom');
            if (scrollBtn) {
                scrollBtn.style.display = userHasScrolledUp ? 'flex' : 'none';
            }
        }

        chatContainer.addEventListener('mousedown', (e) => {
            if (e.offsetX >= chatContainer.clientWidth - 16) {
                isUserDraggingScrollbar = true;
            }
        });

        window.addEventListener('mouseup', () => {
            if (isUserDraggingScrollbar) {
                isUserDraggingScrollbar = false;
                const dist = chatContainer.scrollHeight - chatContainer.clientHeight - chatContainer.scrollTop;
                if (dist <= 60) {
                    userHasScrolledUp = false;
                }
                updateScrollBtn();
            }
        });

        chatContainer.addEventListener('wheel', (e) => {
            if (e.deltaY < 0) {
                const dist = chatContainer.scrollHeight - chatContainer.clientHeight - chatContainer.scrollTop;
                if (dist > 50) {
                    userHasScrolledUp = true;
                    updateScrollBtn();
                }
            } else if (e.deltaY > 0) {
                setTimeout(() => {
                    const dist = chatContainer.scrollHeight - chatContainer.clientHeight - chatContainer.scrollTop;
                    if (dist <= 60) {
                        userHasScrolledUp = false;
                        updateScrollBtn();
                    }
                }, 50);
            }
        }, { passive: true });

        chatContainer.addEventListener('touchmove', () => {
            setTimeout(() => {
                const dist = chatContainer.scrollHeight - chatContainer.clientHeight - chatContainer.scrollTop;
                userHasScrolledUp = dist > 80;
                updateScrollBtn();
            }, 60);
        }, { passive: true });

        chatContainer.addEventListener('scroll', () => {
            const dist = chatContainer.scrollHeight - chatContainer.clientHeight - chatContainer.scrollTop;
            if (dist <= 60) {
                userHasScrolledUp = false;
                updateScrollBtn();
            } else if (isUserDraggingScrollbar) {
                userHasScrolledUp = true;
                updateScrollBtn();
            }
        });

        function scrollToBottom(force = false) {
            if (force) {
                userHasScrolledUp = false;
            }
            if (!userHasScrolledUp) {
                chatContainer.scrollTop = chatContainer.scrollHeight;
                requestAnimationFrame(() => {
                    if (!userHasScrolledUp) {
                        chatContainer.scrollTop = chatContainer.scrollHeight;
                    }
                });
            }
            updateScrollBtn();
        }

        const seenMessageIds = new Set();
        const recentMessageHashes = new Map();

        function addMessage(platform, user, message, badges = [], color = '#ffffff', twitchEmotes = null, msgId = null, customTTS = null, gifUrl = null, gifs = [], isHtml = false, headerHtml = null, isGift = false) {
            try {
                platform = platform || 'twitch';
                user = String(user || 'Usuario');
                message = String(message !== undefined && message !== null ? message : '');
                badges = Array.isArray(badges) ? badges : [];
                color = color || '#ffffff';

                // 1. Deduplicación por msgId estricto si existe
                if (msgId && seenMessageIds.has(msgId)) return;

                // 2. Deduplicación por contenido y usuario en ventana de 3s (evita duplicar si llega por Socket e IPC)
                // Mensajes solo-imagen (stickers): usar las URLs como huella para no colapsar stickers distintos
                const textSnippet = String(message).replace(/<[^>]*>/g, '').trim().slice(0, 80)
                    || (String(message).match(/src="[^"]+"/g) || []).join('|').slice(0, 300);
                const contentKey = `${platform}:${user}:${textSnippet}`;
                const now = Date.now();
                if (recentMessageHashes.has(contentKey) && (now - recentMessageHashes.get(contentKey) < 3000)) {
                    return;
                }
                recentMessageHashes.set(contentKey, now);
                if (recentMessageHashes.size > 500) {
                    const firstKey = recentMessageHashes.keys().next().value;
                    recentMessageHashes.delete(firstKey);
                }

                if (msgId) {
                    seenMessageIds.add(msgId);
                    if (seenMessageIds.size > 500) {
                        const first = seenMessageIds.values().next().value;
                        seenMessageIds.delete(first);
                    }
                }

                updateConnStatus(true, 'Activo');

                if (chatContainer.innerHTML.includes('Esperando mensajes...')) chatContainer.innerHTML = '';

                const entry = document.createElement('div');
                entry.className = 'chat-line';
                entry.dataset.platform = platform;
                if (platformFilters && platformFilters[platform] === false) entry.classList.add('hidden-platform');

                const isTikTokGift = Boolean(isGift) || Boolean(msgId && String(msgId).startsWith('tt-gift-'));
                entry.dataset.isGift = isTikTokGift ? 'true' : 'false';
                if (isTikTokGift) {
                    entry.classList.add('chat-gift-item');
                    if (!showTikTokGifts) entry.classList.add('hidden-gift');
                }

                if (msgId) entry.id = msgId;

                let platformIcon = '';
                if (platform === 'twitch') platformIcon = '<i class="fa-brands fa-twitch platform-icon" style="color: #9146FF;"></i>';
                else if (platform === 'tiktok') platformIcon = '<i class="fa-brands fa-tiktok platform-icon" style="color: #ff0050;"></i>';
                else if (platform === 'kick') platformIcon = '<i class="fa-brands fa-kickstarter platform-icon" style="color: #53fc18;"></i>';

                const twitchEmoteMap = {};
                if (twitchEmotes && typeof twitchEmotes === 'object') {
                    Object.keys(twitchEmotes).forEach(id => {
                        const ranges = twitchEmotes[id];
                        if (ranges && ranges.length > 0 && typeof ranges[0] === 'string') {
                            const [start, end] = ranges[0].split('-').map(Number);
                            if (!isNaN(start) && !isNaN(end)) {
                                const code = message.substring(start, end + 1);
                                twitchEmoteMap[code] = `https://static-cdn.jtvnw.net/emoticons/v2/${id}/default/dark/2.0`;
                            }
                        }
                    });
                }

                // Detección de GIFs de Twitch / ChatIS
                const gifMatch = typeof message === 'string' ? (message.match(/\[(.*?) GIF by (.*?)\]/i) || message.match(/\[(.*?) GIF\]/i)) : null;
                if (gifMatch && !customTTS) {
                    customTTS = `${user} envió un GIF: ${gifMatch[1] || 'animado'}`;
                }

                let processedMessage = isHtml ? message : escapeHtml(message);
                let isGifOnly = false;

                if (!isHtml) {
                    // Renderizado de GIFs (igual que ChatIS)
                    if (Array.isArray(gifs) && gifs.length > 0) {
                        const sortedGifs = [...gifs].sort((a, b) => (b.start || 0) - (a.start || 0));
                        for (const gif of sortedGifs) {
                            if (gif && gif.url) {
                                const img = `<img class="gif chat-gif" src="${gif.url}" data-id="${gif.id || ''}" loading="lazy" />`;
                                if (processedMessage.match(/\[(.*?) GIF by (.*?)\]/i)) {
                                    processedMessage = processedMessage.replace(/\[(.*?) GIF by (.*?)\]/i, img);
                                    isGifOnly = true;
                                } else if (processedMessage.match(/\[(.*?) GIF\]/i)) {
                                    processedMessage = processedMessage.replace(/\[(.*?) GIF\]/i, img);
                                    isGifOnly = true;
                                } else if (!isNaN(gif.start) && !isNaN(gif.end) && gif.start >= 0 && gif.end >= gif.start) {
                                    processedMessage = processedMessage.slice(0, gif.start) + img + processedMessage.slice(gif.end + 1);
                                } else {
                                    processedMessage += ' ' + img;
                                }
                            }
                        }
                    } else if (gifUrl) {
                        const img = `<img class="gif chat-gif" src="${gifUrl}" loading="lazy" />`;
                        if (processedMessage.match(/\[(.*?) GIF by (.*?)\]/i)) {
                            processedMessage = processedMessage.replace(/\[(.*?) GIF by (.*?)\]/gi, img);
                            isGifOnly = true;
                        } else if (processedMessage.match(/\[(.*?) GIF\]/i)) {
                            processedMessage = processedMessage.replace(/\[(.*?) GIF\]/gi, img);
                            isGifOnly = true;
                        } else {
                            processedMessage += ' ' + img;
                        }
                    }

                    // Si no es un mensaje puramente de GIF, parsear emotes de Twitch y 7TV
                    if (!isGifOnly) {
                        const words = processedMessage.split(' ');
                        processedMessage = words.map(word => {
                            if (word.startsWith('<img') || word.includes('chat-gif')) return word;
                            if (twitchEmoteMap[word]) return `<span class="emote-container"><img src="${twitchEmoteMap[word]}" class="emote" alt="${word}"></span>`;
                            if (emotes[word]) return `<span class="emote-container"><img src="${emotes[word]}" class="emote" alt="${word}"></span>`;
                            return word;
                        }).join(' ');

                        // Parsear emotes de Kick: formato nativo [emote:ID:NAME] o [emote:ID]
                        processedMessage = processedMessage.replace(/\[emote:(\d+)(?::([^\]]+))?\]/g, (match, id, name) => {
                            const emoteName = escapeHtml(name || `emote-${id}`);
                            return `<span class="emote-container"><img src="https://files.kick.com/emotes/${encodeURIComponent(id)}/fullsize" class="emote" alt="${emoteName}" title="${emoteName}" loading="lazy"></span>`;
                        });
                        processedMessage = processedMessage.replace(/\[kick_emote:([^\]]+)\]/g, (match, url) => {
                            const cleanUrl = url.trim();
                            if (/^https?:\/\/[^\s"']+$/i.test(cleanUrl)) {
                                return `<span class="emote-container"><img src="${escapeHtml(cleanUrl)}" class="emote" loading="lazy"></span>`;
                            }
                            return '';
                        });
                    }
                }

                const badgesHtml = badges.filter(b => typeof b === 'string' && /^https?:\/\//i.test(b)).map(b => `<img src="${escapeHtml(b)}" class="badge">`).join('');
                const safeUser = escapeHtml(user);
                const isLight = isCurrentThemeLight();
                const finalColor = getAccessibleUserColor(color, isLight);
                const isActionText = isHtml && typeof processedMessage === 'string' && processedMessage.includes('redeem-action-text');

                entry.innerHTML = `
                    ${headerHtml ? `<div class="chat-header-info" style="font-size: 0.82em; color: var(--redeem-subtle); margin-bottom: 2px; display: flex; align-items: center; gap: 5px; line-height: 1.2;">${headerHtml}</div>` : ''}
                    <div class="message-body">
                        ${platformIcon}
                        <span class="badges">${badgesHtml}</span>
                        <span class="username" data-raw-color="${escapeHtml(color)}" style="color: ${finalColor};">${safeUser}</span>${processedMessage ? (isActionText ? ' ' : `<span class="colon">:</span> `) : ''}<span class="message-content">${processedMessage}</span>
                    </div>
                `;

                entry.onclick = () => {
                    const textToSpeak = customTTS || `${user} dice: ${message}`;
                    sendTtsControl({ action: 'force-speak', text: textToSpeak, elementId: msgId });
                };

                // Limitar cantidad máxima de elementos en el DOM
                if (chatContainer.childElementCount > 250) {
                    chatContainer.removeChild(chatContainer.firstChild);
                }

                chatContainer.appendChild(entry);

                // Auto-scroll garantizado hacia el último mensaje si el usuario no ha subido a leer
                scrollToBottom();

                // Si hay imágenes/emotes/insignias que carguen después de unos milisegundos, mantener anclado al fondo
                const entryImgs = entry.querySelectorAll('img');
                if (entryImgs.length > 0) {
                    entryImgs.forEach(img => {
                        if (!img.complete) {
                            img.addEventListener('load', () => {
                                if (!userHasScrolledUp) scrollToBottom();
                            }, { once: true });
                        }
                    });
                }
            } catch (err) {
                console.error('[Multichat] Error en addMessage:', err);
            }
        }

        function extractWatchStreakFromTags(tags) {
            if (!tags || typeof tags !== 'object') return 0;
            const streakKeys = [
                'msg-param-watch-streak',
                'msgParamWatchStreak',
                'msg-param-streak-count',
                'msgParamStreakCount',
                'msg-param-streak-val',
                'msg-param-streak-value',
                'msg-param-streak',
                'watch-streak',
                'watchStreak',
                'streak-count',
                'viewer-streak'
            ];
            for (const key of streakKeys) {
                if (tags[key] !== undefined && tags[key] !== null && tags[key] !== '') {
                    const val = parseInt(tags[key], 10);
                    if (!isNaN(val) && val > 0) return val;
                }
            }
            if (tags['msg-id'] === 'watch-streak' || tags['msg-id'] === 'watch_streak') {
                const val = parseInt(tags['msg-param-value'] || tags['msg-param-count'] || tags['value'] || 0, 10);
                if (!isNaN(val) && val > 0) return val;
            }
            return 0;
        }

        // --- MANEJO DE NOMBRES DE TIKTOK (EVITAR CARACTERES INVISIBLES Y LIMITAR A 20 CARACTERES) ---
        const INVISIBLE_OR_SPACE_REGEX = /^[\s\u0000-\u001F\u007F-\u009F\u00A0\u1680\u180E\u2000-\u200F\u2028\u2029\u202A-\u202E\u202F\u205F\u2060\u2800\u3000\u3164\uFFA0\uFEFF]+|[\s\u0000-\u001F\u007F-\u009F\u00A0\u1680\u180E\u2000-\u200F\u2028\u2029\u202A-\u202E\u202F\u205F\u2060\u2800\u3000\u3164\uFFA0\uFEFF]+$/g;
        const INTERNAL_INVISIBLE_OR_SPACE_REGEX = /[\s\u00A0\u1680\u180E\u2000-\u200F\u2028\u2029\u202A-\u202E\u202F\u205F\u2060\u2800\u3000\u3164\uFFA0\uFEFF]+/g;

        function cleanVisibleName(str) {
            if (!str || typeof str !== 'string') return '';
            let clean = str.replace(INVISIBLE_OR_SPACE_REGEX, '');
            clean = clean.replace(INTERNAL_INVISIBLE_OR_SPACE_REGEX, ' ');
            clean = clean.trim();
            if (!clean) return '';

            // Comprobar si contiene al menos una letra, número o emoji (evita nombres de sólo puntos '...', espacios o símbolos invisibles)
            let hasSubstance = false;
            try {
                hasSubstance = /[\p{L}\p{N}]/u.test(clean) || /\p{Extended_Pictographic}/u.test(clean);
            } catch (e) {
                hasSubstance = /[a-zA-Z0-9\u00C0-\u024F\u1E00-\u1EFF]/.test(clean);
            }
            if (!hasSubstance) return '';

            return clean;
        }

        function truncateDisplayName(name, maxChars = 20) {
            if (!name) return 'Usuario';
            const chars = Array.from(name);
            if (chars.length > maxChars) {
                const sliced = chars.slice(0, maxChars).join('').trimEnd();
                return (sliced || chars.slice(0, maxChars).join('')) + '...';
            }
            return name;
        }

        function getTikTokDisplayName(d) {
            if (!d) return 'Usuario';
            const rawNick = (typeof d.nickname === 'string' && d.nickname)
                || (d.user && typeof d.user.nickname === 'string' && d.user.nickname)
                || (d.userDetails && typeof d.userDetails.nickname === 'string' && d.userDetails.nickname)
                || (d.sender && typeof d.sender.nickname === 'string' && d.sender.nickname);
            const cleanNick = cleanVisibleName(rawNick);

            if (cleanNick) {
                return truncateDisplayName(cleanNick, 20);
            }

            // Fallback a uniqueId si el nickname es invisible, vacío, sólo puntos/símbolos o bot
            const rawHandle = (typeof d.uniqueId === 'string' && d.uniqueId)
                || (d.user && typeof d.user.uniqueId === 'string' && d.user.uniqueId)
                || (d.userDetails && typeof d.userDetails.uniqueId === 'string' && d.userDetails.uniqueId)
                || (d.sender && typeof d.sender.uniqueId === 'string' && d.sender.uniqueId)
                || (typeof d.username === 'string' && d.username);
            const cleanHandle = cleanVisibleName(rawHandle) || (typeof rawHandle === 'string' ? rawHandle.trim() : '');

            if (cleanHandle) {
                return truncateDisplayName(cleanHandle, 20);
            }

            return d.userId ? String(d.userId) : 'Usuario';
        }

        function getTikTokHandle(d) {
            if (!d) return 'user';
            const rawHandle = (typeof d.uniqueId === 'string' && d.uniqueId)
                || (d.user && typeof d.user.uniqueId === 'string' && d.user.uniqueId)
                || (d.userDetails && typeof d.userDetails.uniqueId === 'string' && d.userDetails.uniqueId)
                || (d.sender && typeof d.sender.uniqueId === 'string' && d.sender.uniqueId)
                || (typeof d.username === 'string' && d.username);
            const cleanHandle = cleanVisibleName(rawHandle) || (typeof rawHandle === 'string' ? rawHandle.trim() : '');
            if (cleanHandle) return cleanHandle;
            const cleanNick = cleanVisibleName(d.nickname || (d.user && d.user.nickname));
            return cleanNick || (d.userId ? String(d.userId) : 'user');
        }

        // --- MANEJO DE EMOTES Y STICKERS DE TIKTOK ---
        const tiktokEmotesMap = new Map();

        function extractSlugFromUrl(url) {
            if (!url || typeof url !== 'string') return '';
            try {
                const lastPart = url.split('/').pop().split('?')[0].split('~')[0];
                return lastPart.replace(/\.[a-z0-9]+$/i, '').toLowerCase();
            } catch(e) { return ''; }
        }

        function registerTikTokEmotes(list) {
            if (!Array.isArray(list)) return;
            list.forEach(e => {
                if (!e) return;
                const img = (e.image && e.image.url_list && e.image.url_list[0])
                    || (e.image && e.image.imageUrl)
                    || e.emoteImageUrl
                    || (typeof e.url === 'string' ? e.url : '');
                if (!img) return;

                const id = String(e.id || e.emoteId || '').trim();
                const name = String(e.name || e.emoteName || '').trim();
                const slug = extractSlugFromUrl(img);

                if (id) {
                    tiktokEmotesMap.set(id.toLowerCase(), img);
                    tiktokEmotesMap.set(`[${id.toLowerCase()}]`, img);
                }
                if (name) {
                    const cleanName = name.replace(/^#/, '').toLowerCase();
                    tiktokEmotesMap.set(cleanName, img);
                    tiktokEmotesMap.set(`[${cleanName}]`, img);
                    tiktokEmotesMap.set(name.toLowerCase(), img);
                    tiktokEmotesMap.set(`[${name.toLowerCase()}]`, img);
                }
                if (slug) {
                    tiktokEmotesMap.set(slug.toLowerCase(), img);
                    tiktokEmotesMap.set(`[${slug.toLowerCase()}]`, img);
                }
            });
        }

        // Solo URLs http(s) para imágenes de emotes/stickers
        function safeEmoteUrl(url) {
            if (typeof url !== 'string') return '';
            const u = url.trim();
            return /^https?:\/\//i.test(u) ? u : '';
        }

        function tiktokEmoteImgTag(url, alt, extraClass) {
            const safe = safeEmoteUrl(url);
            if (!safe) return '';
            const a = escapeHtml(alt || 'emote');
            return `<span class="emote-container"><img src="${escapeHtml(safe)}" class="emote tiktok-emote${extraClass ? ' ' + extraClass : ''}" alt="${a}" title="${a}" loading="lazy"></span>`;
        }

        // Acepta el formato normalizado de main.js ({ id, url, pos }) y el raw del conector
        // ({ placeInComment, emote: { emoteId, image: { imageUrl } } } / { emoteId, image: { url: [] } })
        function normalizeTikTokEmotes(list) {
            if (!Array.isArray(list)) return [];
            const out = [];
            list.forEach(e => {
                if (!e || typeof e !== 'object') return;
                const em = (e.emote && typeof e.emote === 'object') ? e.emote : e;
                const img = (em.image && typeof em.image === 'object') ? em.image : {};
                const url = safeEmoteUrl(e.url || em.url || img.imageUrl || (Array.isArray(img.url_list) ? img.url_list[0] : '') || (Array.isArray(img.url) ? img.url[0] : '') || em.emoteImageUrl || e.emoteImageUrl || '');
                if (!url) return;
                const rawPos = (e.pos !== undefined && e.pos !== null) ? e.pos : e.placeInComment;
                const pos = (rawPos !== undefined && rawPos !== null && rawPos !== '' && Number.isFinite(Number(rawPos))) ? Math.max(0, Math.floor(Number(rawPos))) : null;
                out.push({
                    id: String(em.emoteId || em.id || e.id || '').trim(),
                    name: String(em.emoteName || em.name || '').trim().replace(/^#/, ''),
                    url,
                    pos
                });
            });
            return out;
        }

        function learnTikTokEmoteKey(key, url) {
            const k = String(key || '').trim().toLowerCase();
            if (!k || !url) return;
            tiktokEmotesMap.set(k, url);
            tiktokEmotesMap.set(`[${k}]`, url);
        }

        // Escapa un tramo de texto y sustituye placeholders "[tag]" conocidos por su imagen
        function renderTikTokTextSegment(segment) {
            const s = String(segment || '');
            let html = '';
            let last = 0;
            s.replace(/\[([^\[\]]{1,40})\]/g, (match, tag, offset) => {
                html += escapeHtml(s.slice(last, offset));
                last = offset + match.length;
                const lowerTag = tag.trim().toLowerCase();
                const img = tiktokEmotesMap.get(lowerTag) || tiktokEmotesMap.get(`[${lowerTag}]`);
                if (img && safeEmoteUrl(img)) {
                    html += tiktokEmoteImgTag(img, tag);
                } else if (/^[a-z0-9_]{1,30}$/.test(lowerTag)) {
                    // Emojis integrados de TikTok ([smile], [happy]...): intentar CDN; si falla, volver al texto
                    const cdnUrl = `https://p16-webcast.tiktokcdn.com/webcast-va/${encodeURIComponent(lowerTag)}.png~tplv-fyjuxuxag8-webp.webp`;
                    const a = escapeHtml(tag);
                    html += `<span class="emote-container"><img src="${cdnUrl}" class="emote tiktok-emote" alt="${a}" title="${a}" loading="lazy" onerror="this.onerror=null;this.parentNode.replaceChild(document.createTextNode('['+this.alt+']'),this);"></span>`;
                } else {
                    html += escapeHtml(match);
                }
                return match;
            });
            html += escapeHtml(s.slice(last));
            return html;
        }

        function renderTikTokComment(comment, emotesList) {
            const raw = String(comment !== undefined && comment !== null ? comment : '');
            const list = normalizeTikTokEmotes(emotesList);

            list.forEach(e => {
                if (e.id) learnTikTokEmoteKey(e.id, e.url);
                if (e.name) learnTikTokEmoteKey(e.name, e.url);
                const slug = extractSlugFromUrl(e.url);
                if (slug) learnTikTokEmoteKey(slug, e.url);
            });

            // Mensaje solo con stickers/emotes: mostrarlos en tamaño grande
            if (!raw.trim()) {
                return list.map(e => tiktokEmoteImgTag(e.url, e.name || 'sticker', 'tiktok-sticker')).join(' ');
            }

            const chars = Array.from(raw); // índice por code point (no parte emojis)
            const positioned = list.filter(e => e.pos !== null && e.pos <= chars.length)
                .map((e, i) => ({ e, i }))
                .sort((a, b) => (a.e.pos - b.e.pos) || (a.i - b.i))
                .map(x => x.e);
            const unpositioned = list.filter(e => !(e.pos !== null && e.pos <= chars.length));

            // Sin posición: asignar en orden a placeholders "[tag]" del texto; el resto se añade al final
            let nextFree = 0;
            if (unpositioned.length > 0) {
                Array.from(raw.matchAll(/\[([^\[\]]{1,40})\]/g)).forEach(m => {
                    if (nextFree >= unpositioned.length) return;
                    const tag = m[1].trim().toLowerCase();
                    if (!tag) return;
                    const current = tiktokEmotesMap.get(tag);
                    if (!current || current === unpositioned[nextFree].url) {
                        learnTikTokEmoteKey(tag, unpositioned[nextFree].url);
                        nextFree++;
                    }
                });
            }

            let html = '';
            let cursor = 0;
            positioned.forEach(e => {
                if (e.pos > cursor) {
                    html += renderTikTokTextSegment(chars.slice(cursor, e.pos).join(''));
                    cursor = e.pos;
                }
                // Si en esa posición hay un placeholder "[...]", lo consumimos para no duplicarlo
                if (chars[cursor] === '[') {
                    const close = chars.indexOf(']', cursor);
                    if (close > cursor && close - cursor <= 41) {
                        const tag = chars.slice(cursor + 1, close).join('');
                        if (tag.trim()) learnTikTokEmoteKey(tag, e.url);
                        cursor = close + 1;
                    }
                }
                html += tiktokEmoteImgTag(e.url, e.name || 'emote');
            });
            html += renderTikTokTextSegment(chars.slice(cursor).join(''));

            unpositioned.slice(nextFree).forEach(e => {
                html += ' ' + tiktokEmoteImgTag(e.url, e.name || 'emote');
            });

            return html.trim();
        }

        // Texto para TTS sin placeholders de stickers/emotes
        function stripTikTokEmotePlaceholders(text, emotesList) {
            let t = String(text || '');
            if (Array.isArray(emotesList) && emotesList.length > 0) t = t.replace(/\[[^\[\]]{1,40}\]/g, ' ');
            return t.replace(/\s{2,}/g, ' ').trim();
        }

                            combo.timer = setTimeout(() => {
                                activeGiftCombos.delete(comboKey);
                                renderFinalGift(combo.maxCount, combo.unitCoins * combo.maxCount);

                    if (isGift) {
                        if (count > 1) {
                            const msgHtml = `<span style="background: rgba(145, 70, 255, 0.25); padding: 4px 8px; border-radius: 6px; border-left: 3px solid #ff69b4; display: inline-block; margin-top: 2px;"><i class="fa-solid fa-gift" style="color: #ff69b4; margin-right: 4px;"></i> ¡Regaló <strong style="color: #ffd700;">${count} subs</strong> a la comunidad!</span>`;
                            addMessage('twitch', username, msgHtml, [], '#9146FF', null, 'msg-subgift-' + Date.now(), `${username} regaló ${count} suscripciones a la comunidad`, null, [], true);
                        } else if (recipient) {
                            const msgHtml = `<span style="background: rgba(145, 70, 255, 0.25); padding: 4px 8px; border-radius: 6px; border-left: 3px solid #ff69b4; display: inline-block; margin-top: 2px;"><i class="fa-solid fa-gift" style="color: #ff69b4; margin-right: 4px;"></i> ¡Regaló una sub a <strong style="color: #00f5d4;">${escapeHtml(recipient)}</strong>!</span>`;
                            addMessage('twitch', username, msgHtml, [], '#9146FF', null, 'msg-subgift-' + Date.now(), `${username} regaló una suscripción a ${recipient}`, null, [], true);
                        } else {
                            const msgHtml = `<span style="background: rgba(145, 70, 255, 0.25); padding: 4px 8px; border-radius: 6px; border-left: 3px solid #ff69b4; display: inline-block; margin-top: 2px;"><i class="fa-solid fa-gift" style="color: #ff69b4; margin-right: 4px;"></i> ¡Regaló una suscripción!</span>`;
                            addMessage('twitch', username, msgHtml, [], '#9146FF', null, 'msg-subgift-' + Date.now(), `${username} regaló una suscripción`, null, [], true);
                        }
                    } else if (months > 1 || streak > 0) {
                        const streakText = streak > 0 ? ` 🔥 <strong style="color: #ff4500;">racha de ${streak} m.</strong>` : '';
                        const monthsText = months > 1 ? ` por <strong style="color: #ffd700;">${months} meses</strong>${streakText}` : '';
                        const commentText = message ? ` — <span style="font-style: italic;">"${escapeHtml(message)}"</span>` : '';
                        const msgHtml = `<span style="background: rgba(145, 70, 255, 0.25); padding: 4px 8px; border-radius: 6px; border-left: 3px solid #ffd700; display: inline-block; margin-top: 2px;"><i class="fa-solid fa-star" style="color: #ffd700; margin-right: 4px;"></i> ¡Se resuscribió${monthsText}! (${planText})${commentText}</span>`;
                        addMessage('twitch', username, msgHtml, [], '#9146FF', null, 'msg-resub-' + Date.now(), `${username} se resuscribió por ${months} meses` + (message ? `: ${message}` : ''), null, [], true);
                    } else {
                        const commentText = message ? ` — <span style="font-style: italic;">"${escapeHtml(message)}"</span>` : '';
                        const msgHtml = `<span style="background: rgba(145, 70, 255, 0.25); padding: 4px 8px; border-radius: 6px; border-left: 3px solid #ffd700; display: inline-block; margin-top: 2px;"><i class="fa-solid fa-star" style="color: #ffd700; margin-right: 4px;"></i> ¡Se ha suscrito! (${planText})${commentText}</span>`;
                        addMessage('twitch', username, msgHtml, [], '#9146FF', null, 'msg-sub-' + Date.now(), `${username} se ha suscrito` + (message ? `: ${message}` : ''), null, [], true);
                    }
                } else if (type === 'cheer') {
                    const username = d.user || d.username || d.uniqueId || d.nickname || 'Usuario';
                    const bits = d.bits || 0;
                    const comment = d.comment || d.message || '';
                    const commentText = comment ? ` — <span style="font-style: italic;">"${escapeHtml(comment)}"</span>` : '';
                    const msgHtml = `<span style="background: rgba(255, 215, 0, 0.15); padding: 4px 8px; border-radius: 6px; border-left: 3px solid #ffd700; display: inline-block; margin-top: 2px;"><i class="fa-solid fa-gem" style="color: #b9a3e3; margin-right: 4px;"></i> Envió <strong style="color: #ffd700;">${bits} Bits</strong>!${commentText}</span>`;
                    addMessage('twitch', username, msgHtml, [], '#9146FF', null, 'msg-cheer-' + Date.now(), `${username} envió ${bits} Bits` + (comment ? `: ${comment}` : ''), null, [], true);
                } else if (type === 'raid') {
                    const username = d.username || d.uniqueId || d.nickname || 'Usuario';
                    const viewers = d.viewers || 0;
                    const msgHtml = `<span style="background: rgba(145, 70, 255, 0.25); padding: 4px 8px; border-radius: 6px; border-left: 3px solid #ff4500; display: inline-block; margin-top: 2px;"><i class="fa-solid fa-bolt" style="color: #ff4500; margin-right: 4px;"></i> ¡Llegó con una Raid de <strong style="color: #ffd700;">${viewers} espectadores</strong>!</span>`;
                    addMessage('twitch', username, msgHtml, [], '#9146FF', null, 'msg-raid-' + Date.now(), `${username} inició una raid con ${viewers} espectadores`, null, [], true);
                }
            } catch (err) {
                console.error('[Multichat] Error en twitch-event:', err);
            }
        }

        function handleKickEvent(payload) {
            try {
                if (!payload) return;
                if (payload.type === 'chat') {
                    const d = payload.data || {};
                    const username = d.nickname || d.uniqueId || d.username || (d.sender && d.sender.username) || 'Usuario';
                    const userColor = d.color || '#53fc18';
                    const msgId = 'kick-' + (d.id || (username + '-' + Date.now()));
                    addMessage('kick', username, d.comment || d.message || d.content || '', d.badges || [], userColor, null, msgId);
                }
            } catch (err) {
                console.error('[Multichat] Error en kick-event:', err);
            }
        }

        function handleTtsStateChange(state) {
            const btn = document.getElementById('btn-tts-pause');
            if (!btn) return;
            if (state && state.isPaused) {
                btn.innerHTML = '<i class="fa-solid fa-play"></i> Reanudar';
                btn.classList.add('active');
            } else {
                btn.innerHTML = '<i class="fa-solid fa-pause"></i> Pausar';
                btn.classList.remove('active');
            }
        }

        function handleTtsSpeakingChange({ elementId, isSpeaking }) {
            document.querySelectorAll('.chat-line.speaking').forEach(el => el.classList.remove('speaking'));
            if (isSpeaking && elementId) {
                const el = document.getElementById(elementId);
                if (el) {
                    el.classList.add('speaking');
                    el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            }
        }

        // --- CANAL 1: SOCKET.IO (OBS, Cloud, Localhost) ---
        if (socket) {
            socket.on('twitch-badges', map => twitchBadgesMap = map);
            socket.on('twitch-channel-points-icon', url => {
                if (url) {
                    twitchChannelPointsIcon = url;
                    document.querySelectorAll('.redeem-cost-icon').forEach(imgEl => {
                        imgEl.src = url;
                        imgEl.style.display = 'inline-block';
                    });
                }
            });
            socket.on('twitch-connection-status', status => {
                if (status && status.type === 'connected') {
                    if (status.broadcasterId) fetchChannelEmotes(status.broadcasterId);
                    if (status.channel) fetchChannelPointsIcon(status.channel);
                }
            });
            socket.on('tiktok-event', handleTikTokEvent);
            socket.on('update-emotes', registerTikTokEmotes);
            socket.on('new-emote-discovered', e => registerTikTokEmotes([e]));
            socket.on('twitch-event', handleTwitchEvent);
            socket.on('kick-event', handleKickEvent);
            socket.on('tts-state-change', handleTtsStateChange);
            socket.on('tts-speaking-change', handleTtsSpeakingChange);
        }

        // --- CANAL 2: WINDOW POSTMESSAGE (Iframe interno en la app) ---
        window.addEventListener('message', (event) => {
            if (!event.data) return;
            const channel = event.data.channel || event.data.type;
            const payload = event.data.payload !== undefined ? event.data.payload : event.data.data;

            if (channel === 'tiktok-event') handleTikTokEvent(payload);
            else if (channel === 'update-emotes') registerTikTokEmotes(payload);
            else if (channel === 'new-emote-discovered') registerTikTokEmotes([payload]);
            else if (channel === 'twitch-event') handleTwitchEvent(payload);
            else if (channel === 'kick-event') handleKickEvent(payload);
            else if (channel === 'tts-state-change') handleTtsStateChange(payload);
            else if (channel === 'tts-speaking-change') handleTtsSpeakingChange(payload || {});
            else if (channel === 'set-tiktok-gifts-visibility') {
                const vis = payload !== undefined ? payload : (event.data.visible !== undefined ? event.data.visible : true);
                applyTikTokGiftsVisibility(vis);
            }
        });

        // --- CANAL 3: ELECTRON IPC (Ventana Pop-out) ---
        if (typeof require !== 'undefined') {
            try {
                const { ipcRenderer } = require('electron');
                // Si Socket.IO ya está conectado, no procesar por IPC para evitar duplicados en el pop-out
                ipcRenderer.on('tiktok-event', (_, payload) => {
                    if (socket && socket.connected) return;
                    handleTikTokEvent(payload);
                });
                ipcRenderer.on('update-emotes', (_, list) => registerTikTokEmotes(list));
                ipcRenderer.on('new-emote-discovered', (_, e) => registerTikTokEmotes([e]));
                ipcRenderer.on('twitch-event', (_, payload) => {
                    if (socket && socket.connected) return;
                    handleTwitchEvent(payload);
                });
                ipcRenderer.on('kick-event', (_, payload) => {
                    if (socket && socket.connected) return;
                    handleKickEvent(payload);
                });
                ipcRenderer.on('tts-state-change', (_, state) => handleTtsStateChange(state));
                ipcRenderer.on('tts-speaking-change', (_, data) => handleTtsSpeakingChange(data || {}));
            } catch (e) { }
        }
    </script>
</body>

</html>
