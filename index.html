<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiveMu</title>
    <style>
        html, body { margin: 0; background: transparent; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; }
        a { color: #bb86fc; }
    </style>
    <script>
        // Redirección segura a gift-overlay.html conservando query string (token) y hash.
        // (Antes esta página usaba require('electron'), que falla en OBS / navegador.)
        (function () {
            var target = 'gift-overlay.html' + window.location.search + window.location.hash;
            window.location.replace(target);
        })();
    </script>
</head>
<body>
    <noscript><p><a href="gift-overlay.html">Abrir overlay de regalos</a></p></noscript>
</body>
</html>
