<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gift Goal Overlay</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { margin: 0; padding: 20px; font-family: 'Segoe UI', sans-serif; background: transparent; overflow: hidden; }
        .drag-region { position: fixed; top: 0; left: 0; width: 100%; height: 20px; -webkit-app-region: drag; z-index: 1000; }
        .wrapper { display: flex; align-items: center; gap: 15px; }
        .goal-container { background: rgba(20, 20, 20, 0.9); border: 2px solid #ffd700; border-radius: 50px; padding: 4px; position: relative; height: 45px; box-shadow: 0 0 15px rgba(255, 215, 0, 0.3); display: flex; align-items: center; overflow: hidden; width: 100%; max-width: 600px; flex-grow: 1; }
        .progress-bar { background: linear-gradient(90deg, #ffa502, #ffd700); height: 100%; border-radius: 40px; width: 0%; transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1); position: absolute; top: 0; left: 0; z-index: 1; box-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }
        .content { position: relative; z-index: 2; width: 100%; display: flex; justify-content: center; align-items: center; padding: 0 20px; color: white; font-weight: 800; text-shadow: 0 2px 4px rgba(0,0,0,0.8); font-size: 1.4rem; }
        .gift-icon { color: #ffd700; font-size: 3.5rem; filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.6)); animation: float 2s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
        .goal-text { font-family: 'Consolas', monospace; position: absolute; right: 20px; font-size: 1.2rem; }
    </style>
    <script src="./token-bridge.js"></script>
</head>
<body>
    <div class="drag-region"></div>

    <div id="main-container" style="display:flex; flex-direction:column; align-items:center; width: 100%;">
        <div class="wrapper" id="container" style="width: 100%;">
            <i class="fa-solid fa-coins gift-icon" id="icon-element"></i>
            <div style="display: flex; flex-direction: column; flex-grow: 1; max-width: 600px;">
                <div class="goal-label-above" id="label-above" style="display:none; color:white; font-weight:800; font-size:1.4rem; margin-bottom:10px; text-shadow:0 2px 4px rgba(0,0,0,0.8); font-family:'Segoe UI', sans-serif; text-align:center; width:100%;"></div>
                <div class="goal-container" style="max-width: 100%;">
                    <div class="progress-bar" id="bar"></div>
                    <div class="content">
                        <span id="label-inside" style="position: absolute; left: 20px; display: none;"></span>
                        <span id="percentage">0%</span>
                        <span class="goal-text" id="text">0 / 0</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const streamToken = urlParams.get('token') || 'default';
        const socketHost = (typeof window !== 'undefined' && window.location && window.location.origin) ? window.location.origin : '';
        const socket = io(socketHost, {
            query: { token: streamToken },
            reconnection: true,
            reconnectionAttempts: Infinity,
            reconnectionDelay: 1000
        });

        socket.on('connect', () => {
            console.log('[Meta Regalos] Conectado a sala:', streamToken);
            socket.emit('join-room', streamToken);
            socket.emit('get_data', streamToken);
        });
        let currentCoins = 0;
        let targetCoins = 1000;
        let labelText = "Meta de Regalos";
        let position = "inside";
        let showIcon = true;

        function updateUI() {
            let percent = (currentCoins / targetCoins) * 100;
            if (percent > 100) percent = 100;
            
            document.getElementById('bar').style.width = percent + '%';
            document.getElementById('text').innerText = `${currentCoins} / ${targetCoins}`;
            document.getElementById('percentage').innerText = Math.floor(percent) + '%';
            
            const aboveEl = document.getElementById('label-above');
            const insideEl = document.getElementById('label-inside');
            
            if (position === 'above') {
                aboveEl.style.display = 'block';
                aboveEl.innerText = labelText;
                insideEl.style.display = 'none';
            } else {
                aboveEl.style.display = 'none';
                if (labelText.trim() !== '') {
                    insideEl.style.display = 'block';
                    insideEl.innerText = labelText;
                } else {
                    insideEl.style.display = 'none';
                }
            }
            
            const iconEl = document.getElementById('icon-element');
            if (iconEl) iconEl.style.display = showIcon ? 'inline-block' : 'none';
        }

        socket.on('data', (data) => {
            // Actualizar Límites y Títulos configurados
            if (data.goals && data.goals.coins) {
                targetCoins = data.goals.coins.target || 1000;
                labelText = data.goals.coins.label !== undefined ? data.goals.coins.label : "Meta de Regalos";
                position = data.goals.coins.position || "inside";
                showIcon = data.goals.coins.showIcon !== false;
            }
            // Actualizar progreso en vivo
            if (data.sessionGlobalCoins !== undefined) {
                currentCoins = data.sessionGlobalCoins;
            }
            updateUI();
        });

        socket.on('gift_event', (data) => {
            if (data && data.totalCoins !== undefined) {
                currentCoins = data.totalCoins;
            } else if (data && data.calculatedCoins) {
                currentCoins += Number(data.calculatedCoins);
            }
            updateUI();
        });

        // Recargar el widget instantáneamente cuando el usuario presione "Guardar" en la app
        socket.on('reload_overlays', () => { location.reload(); });
    </script>
</body>
</html>
