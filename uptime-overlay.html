<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiempo en Directo</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
    <!--
        Parámetros URL:
          label       Texto de la etiqueta (por defecto "EN DIRECTO")
          theme       neon | minimal | tiktok (por defecto neon)
          color       Color principal, ej. color=ff0050 o color=%23ff0050
          size        Escala (ej. 1.5) o tamaño de los dígitos en px (ej. 72)
          hideOffline 1 = ocultar el widget cuando no estás en directo
          offlineText Texto cuando no estás en directo (por defecto "SIN DIRECTO")
          showSeconds 0 = mostrar solo HH:MM (por defecto 1)
    -->
    <style>
        :root {
            --primary: #00f2fe;
            --glow: rgba(0, 242, 254, 0.45);
            --bg-card: rgba(13, 17, 28, 0.85);
            --border-card: rgba(0, 242, 254, 0.3);
            --live: #ff2d55;
            --text-color: #ffffff;
            --scale: 1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            background: transparent !important;
            background-color: transparent !important;
            font-family: 'Outfit', sans-serif;
            color: var(--text-color);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 8px;
            user-select: none;
            -webkit-user-select: none;
        }

        .uptime-card {
            display: inline-flex;
            align-items: center;
            gap: calc(14px * var(--scale));
            padding: calc(10px * var(--scale)) calc(22px * var(--scale));
            border-radius: calc(16px * var(--scale));
            background: var(--bg-card);
            border: 2px solid var(--border-card);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 20px var(--glow);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            transition: opacity 0.4s ease, transform 0.4s ease, border-color 0.3s, box-shadow 0.3s;
            white-space: nowrap;
        }

        .uptime-card.hidden { opacity: 0; transform: scale(0.92); }

        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: calc(8px * var(--scale));
            font-weight: 900;
            font-size: calc(1.05rem * var(--scale));
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #fff;
        }

        .live-dot {
            width: calc(11px * var(--scale));
            height: calc(11px * var(--scale));
            border-radius: 50%;
            background: var(--live);
            box-shadow: 0 0 10px var(--live);
            animation: blink 1.2s infinite;
            flex-shrink: 0;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .time-digits {
            font-family: 'Orbitron', monospace;
            font-weight: 900;
            font-size: calc(2.4rem * var(--scale));
            letter-spacing: 2px;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            color: #fff;
            text-shadow: 0 0 15px var(--glow);
        }

        /* Estados */
        .uptime-card.offline .live-dot { background: #777; box-shadow: none; animation: none; }
        .uptime-card.offline .time-digits { display: none; }
        .uptime-card.offline { border-color: rgba(255, 255, 255, 0.15); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6); }
        .uptime-card.paused .live-dot { background: #ffa502; box-shadow: 0 0 8px #ffa502; animation: none; }
        .uptime-card.paused .time-digits { opacity: 0.75; }

        /* --- TEMA NEON (por defecto) --- */
        body[data-theme="neon"] .live-badge {
            background: linear-gradient(90deg, #ffffff, var(--primary));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* --- TEMA MINIMAL (solo texto, sin tarjeta) --- */
        body[data-theme="minimal"] .uptime-card {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            padding: 0 !important;
        }
        body[data-theme="minimal"] .live-badge,
        body[data-theme="minimal"] .time-digits {
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.95), 0 0 4px #000, 2px 2px 2px #000;
        }
        body[data-theme="minimal"] .time-digits { color: var(--primary); }

        /* --- TEMA TIKTOK (píldora con colores de la marca) --- */
        body[data-theme="tiktok"] {
            --primary: #ff0050;
            --glow: rgba(255, 0, 80, 0.45);
            --border-card: rgba(0, 242, 234, 0.55);
            --bg-card: rgba(0, 0, 0, 0.82);
        }
        body[data-theme="tiktok"] .uptime-card {
            border-radius: 999px;
            padding: calc(6px * var(--scale)) calc(20px * var(--scale)) calc(6px * var(--scale)) calc(6px * var(--scale));
            box-shadow: -3px 0 0 rgba(0, 242, 234, 0.9), 3px 0 0 rgba(255, 0, 80, 0.9), 0 10px 30px rgba(0, 0, 0, 0.6);
        }
        body[data-theme="tiktok"] .live-badge {
            background: var(--primary);
            padding: calc(6px * var(--scale)) calc(14px * var(--scale));
            border-radius: 999px;
            font-size: calc(0.95rem * var(--scale));
        }
        body[data-theme="tiktok"] .live-dot { background: #fff; box-shadow: 0 0 8px #fff; }
        body[data-theme="tiktok"] .time-digits {
            font-family: 'Outfit', sans-serif;
            text-shadow: -2px 0 0 rgba(0, 242, 234, 0.8), 2px 0 0 rgba(255, 0, 80, 0.8);
        }
        body[data-theme="tiktok"] .uptime-card.offline .live-badge { background: #444; }
    </style>
    <script src="./token-bridge.js"></script>
</head>
<body data-theme="neon">

    <div class="uptime-card offline" id="uptime-card">
        <span class="live-badge"><span class="live-dot"></span><span id="uptime-label">SIN DIRECTO</span></span>
        <span class="time-digits" id="uptime-digits">00:00:00</span>
    </div>

    <script>
        // --- PARÁMETROS URL ---
        const urlParams = new URLSearchParams(window.location.search);
        const paramTheme = (urlParams.get('theme') || 'neon').toLowerCase();
        const paramLabel = urlParams.get('label') || 'EN DIRECTO';
        const paramOfflineText = urlParams.get('offlineText') || 'SIN DIRECTO';
        const paramColor = urlParams.get('color');
        const paramSize = parseFloat(urlParams.get('size'));
        const hideOffline = urlParams.get('hideOffline') === '1' || urlParams.get('hideOffline') === 'true';
        const showSeconds = !(urlParams.get('showSeconds') === '0' || urlParams.get('showSeconds') === 'false');

        document.body.setAttribute('data-theme', ['neon', 'minimal', 'tiktok'].includes(paramTheme) ? paramTheme : 'neon');

        if (paramColor) {
            let c = paramColor.trim();
            if (/^[0-9a-fA-F]{3,8}$/.test(c)) c = '#' + c;
            const root = document.documentElement.style;
            document.body.style.setProperty('--primary', c);
            document.body.style.setProperty('--border-card', c);
            document.body.style.setProperty('--glow', c + '73');
            root.setProperty('--primary', c);
        }

        if (!isNaN(paramSize) && paramSize > 0) {
            // <= 10 se interpreta como escala, si no como px de los dígitos (base 2.4rem = 38.4px)
            const scale = paramSize <= 10 ? paramSize : paramSize / 38.4;
            document.documentElement.style.setProperty('--scale', String(Math.max(0.2, Math.min(scale, 10))));
        }

        // --- ELEMENTOS DEL DOM ---
        const cardEl = document.getElementById('uptime-card');
        const labelEl = document.getElementById('uptime-label');
        const digitsEl = document.getElementById('uptime-digits');

        // --- ESTADO LOCAL ---
        // running: elapsed = Date.now() - startedAt (mismo reloj de la PC); si no, elapsed = elapsedMs congelado
        let uptime = { live: false, running: false, paused: false, startedAt: 0, elapsedMs: 0, streamStartTime: 0 };
        let lastRenderedState = '';

        function formatElapsed(ms) {
            const total = Math.max(0, Math.floor(ms / 1000));
            const h = Math.floor(total / 3600);
            const m = Math.floor((total % 3600) / 60);
            const s = total % 60;
            const hh = String(h).padStart(2, '0');
            const mm = String(m).padStart(2, '0');
            return showSeconds ? `${hh}:${mm}:${String(s).padStart(2, '0')}` : `${hh}:${mm}`;
        }

        function getElapsedMs() {
            if (uptime.running && uptime.startedAt > 0) return Math.max(0, Date.now() - uptime.startedAt);
            return Math.max(0, Number(uptime.elapsedMs) || 0);
        }

        function renderUI() {
            let state = 'offline';
            if (uptime.running && uptime.startedAt > 0) state = 'live';
            else if (uptime.paused) state = 'paused';

            if (state !== lastRenderedState) {
                lastRenderedState = state;
                cardEl.classList.remove('offline', 'paused', 'live');
                cardEl.classList.add(state);
                labelEl.innerText = state === 'offline' ? paramOfflineText : paramLabel;
                cardEl.classList.toggle('hidden', hideOffline && state === 'offline');
            }
            if (state !== 'offline') {
                const txt = formatElapsed(getElapsedMs());
                if (txt.length !== digitsEl.innerText.length) { digitsEl.innerText = txt; fitCard(); }
                else digitsEl.innerText = txt;
            }
            if (state !== lastFitState) { lastFitState = state; fitCard(); }
        }

        // Si la fuente de OBS es más estrecha que la tarjeta, reducirla para que no se corte por los lados
        let lastFitState = '';
        function fitCard() {
            cardEl.style.zoom = '';
            const avail = window.innerWidth - 16;
            const w = cardEl.offsetWidth;
            if (avail > 0 && w > avail) cardEl.style.zoom = String(avail / w);
        }
        window.addEventListener('resize', fitCard);
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitCard);

        function handleUptimeUpdate(u) {
            if (!u || typeof u !== 'object') return;
            uptime = {
                live: !!u.live,
                running: !!u.running,
                paused: !!u.paused,
                startedAt: Number(u.startedAt) || 0,
                elapsedMs: Number(u.elapsedMs) || 0,
                streamStartTime: Number(u.streamStartTime) || 0
            };
            renderUI();
        }

        // --- TICKER LOCAL (250ms para que el cambio de segundo se vea sin retraso) ---
        setInterval(renderUI, 250);

        // --- CONEXIÓN SOCKET.IO ---
        const streamToken = urlParams.get('token') || 'default';
        const socketHost = (typeof window !== 'undefined' && window.location && window.location.origin) ? window.location.origin : '';
        const socket = io(socketHost, {
            query: { token: streamToken },
            reconnection: true,
            reconnectionAttempts: Infinity,
            reconnectionDelay: 1000
        });
        window.socket = socket;

        socket.on('connect', () => {
            console.log('[Uptime] Conectado en sala:', streamToken);
            socket.emit('join-room', streamToken);
            socket.emit('get_data', streamToken);
        });

        socket.on('uptime_data', handleUptimeUpdate);

        socket.on('data', (data) => {
            if (!data) return;
            if (data.uptime) {
                handleUptimeUpdate(data.uptime);
            } else if (data.streamStartTime !== undefined) {
                const sst = Number(data.streamStartTime) || 0;
                handleUptimeUpdate({ live: sst > 0, running: sst > 0, paused: false, startedAt: sst, elapsedMs: 0, streamStartTime: sst });
            }
        });

        // Recargar el widget instantáneamente cuando el usuario guarde cambios en la app
        socket.on('reload_overlays', () => {
            location.reload();
        });

        // Primer render inmediato
        renderUI();
    </script>
</body>
</html>
